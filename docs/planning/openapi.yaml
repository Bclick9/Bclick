openapi: 3.1.0
info:
  title: Bclick Platform API
  version: 1.0.0-planning
  description: >-
    Proposed Bclick-owned REST API contract. Internal REST resources are prefixed /api/v1. Provider/PSP
    inbound callbacks use unversioned /callbacks/... paths. This specification does not define BigBang
    or WinHouse outbound APIs. Callback signature/response contracts must be verified against complete
    current vendor agent specifications and the specific tenant sandbox before implementation. Internal
    money is serialized as exact decimal strings with currency codes; provider JSON-number callbacks require
    raw-body/lexeme-preserving parsers. This is a planning contract, not an implemented API.
  contact:
    name: Bclick engineering
servers:
  - url: https://api.example.invalid
    description: Placeholder Bclick origin. Internal REST resources are under /api/v1; inbound callbacks are 
      unversioned.
tags:
  - name: Health
  - name: Authentication
  - name: Player
  - name: Wallet
  - name: Casino
  - name: Sportsbook
  - name: CMS
  - name: Backoffice
  - name: Provider callbacks
  - name: Security
  - name: Reporting
  - name: Payments
security:
  - playerSession: []
paths:
  /api/v1/health/live:
    get:
      tags: [Health]
      security: []
      summary: Process liveness
      responses:
        '200':
          description: Process is running.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      operationId: getHealthLive
  /api/v1/health/ready:
    get:
      tags: [Health]
      security: []
      summary: Readiness check
      responses:
        '200':
          description: Critical dependencies are ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '503':
          $ref: '#/components/responses/ReadinessUnavailable'
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      operationId: getHealthReady
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      security: []
      summary: Register a player account
      description: >-
        Registration requires server-side CAPTCHA verification, an IP-based limit of 5 registration attempts per hour,
        supported-jurisdiction checks, date-of-birth age >= 18 validation, and affirmative terms/age acknowledgements.
        Successful registration activates the player without required email verification and does not fund the wallet.
      operationId: registerPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: Account created and active after server-side validation. Email verification is optional and is not required for initial activation.
          headers:
            Set-Cookie: {$ref: '#/components/headers/SessionCookie'}
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlayerResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
      parameters:
        - $ref: '#/components/parameters/XRequestId'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      security: []
      summary: Authenticate and create a server-side session
      operationId: loginPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Session created; cookie value is opaque and not returned in JSON.
          headers:
            Set-Cookie: {$ref: '#/components/headers/SessionCookie'}
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlayerResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
      parameters:
        - $ref: '#/components/parameters/XRequestId'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current session
      responses:
        '204': {description: Session revoked and cookie expired., headers: {Set-Cookie: {$ref: '#/components/headers/ExpiredSessionCookie'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      operationId: postAuthLogout
  /api/v1/auth/session:
    get:
      tags: [Authentication]
      summary: Get the current player session and minimal player summary
      responses:
        '200':
          description: Current session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlayerResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401': {$ref: '#/components/responses/Unauthorized'}
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      operationId: getAuthSession
  /api/v1/auth/password-reset/request:
    post:
      tags: [Authentication]
      security: []
      summary: Request a password reset
      description: >-
        Use account-enumeration-safe generic responses. Enforce a limit of 3 password-reset requests per normalized email per hour,
        with bounded retry responses; store only a hash of single-use reset tokens and never log them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: {email: {type: string, format: email, maxLength: 254}}
      responses:
        '202': {description: Request accepted; response is intentionally generic.}
        '400': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      operationId: postAuthPasswordResetRequest
  /api/v1/auth/password-reset/confirm:
    post:
      tags: [Authentication]
      security: []
      summary: Consume a single-use reset challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: {type: string, minLength: 32, maxLength: 512}
                newPassword: {type: string, minLength: 12, maxLength: 1024, format: password}
      responses:
        '204': {description: Password changed; existing sessions are revoked.}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      operationId: postAuthPasswordResetConfirm
  /api/v1/player/profile:
    get:
      tags: [Player]
      responses:
        '200':
          description: Player profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlayerResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401': {$ref: '#/components/responses/Unauthorized'}
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      operationId: getPlayerProfile
    patch:
      tags: [Player]
      summary: Update only editable profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName: {type: string, minLength: 1, maxLength: 80}
                language: {$ref: '#/components/schemas/LanguageCode'}
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlayerResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      operationId: patchPlayerProfile
  /api/v1/player/preferences:
    get:
      tags: [Player]
      responses:
        '200':
          description: Preferences; display currency is not an assertion of provider settlement currency.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreferencesResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      operationId: getPlayerPreferences
    patch:
      tags: [Player]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                preferredDisplayCurrency:
                  $ref: '#/components/schemas/CurrencyCode'
                language: {$ref: '#/components/schemas/LanguageCode'}
      responses:
        '200':
          description: Updated preferences.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreferencesResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400': {$ref: '#/components/responses/ValidationError'}
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      operationId: patchPlayerPreferences
  /api/v1/wallets:
    get:
      tags: [Wallet]
      summary: List player's own currency wallets
      responses:
        '200':
          description: Wallet list.
          content:
            application/json:
              schema:
                type: object
                required: [data, page, requestId]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/WalletBalance'}
                  page:
                    $ref: '#/components/schemas/ListPage'
                  requestId: {type: string}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: cursor
          in: query
          required: false
          schema:
            type:
              - string
              - 'null'
            maxLength: 2048
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      operationId: getWallets
  /api/v1/wallets/{currency}/balance:
    parameters:
      - $ref: '#/components/parameters/Currency'
    get:
      tags: [Wallet]
      summary: Read current cached projection of the player's wallet
      responses:
        '200':
          description: Exact decimal strings from the local ledger projection.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data: {$ref: '#/components/schemas/WalletBalance'}
                  requestId: {type: string}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      operationId: getWalletsByCurrencyBalance
  /api/v1/wallets/{currency}/statement:
    parameters:
      - $ref: '#/components/parameters/Currency'
    get:
      tags: [Wallet]
      summary: Return this player's ledger-backed statement
      parameters:
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, description: Exclusive end time, schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/XRequestId'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Page of posted ledger-backed movements.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatementResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
      operationId: getWalletsByCurrencyStatement
  /api/v1/wallets/fx-quotes:
    post:
      tags: [Wallet]
      summary: Create a short-lived FX quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sourceCurrency, targetCurrency, sourceAmount]
              properties:
                sourceCurrency:
                  $ref: '#/components/schemas/CurrencyCode'
                targetCurrency:
                  $ref: '#/components/schemas/CurrencyCode'
                sourceAmount:
                  $ref: '#/components/schemas/PositiveAmount'
      responses:
        '201':
          description: Quote is valid only until expiresAt; example values do not represent a live rate.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FxQuoteResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      operationId: postWalletsFxQuotes
  /api/v1/wallets/fx-executions:
    post:
      tags: [Wallet]
      summary: Consume a quote and atomically convert between wallet accounts
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quoteId]
              properties: {quoteId: {type: string, format: uuid}}
      responses:
        '201':
          description: FX execution.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FxExecutionResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/BusinessRefusal'}
      operationId: postWalletsFxExecutions
  /api/v1/casino/categories:
    get:
      tags: [Casino]
      security: []
      summary: List public locally stored casino categories
      responses:
        '200':
          description: Public category list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoriesResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: cursor
          in: query
          required: false
          schema:
            type:
              - string
              - 'null'
            maxLength: 2048
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      operationId: getCasinoCategories
  /api/v1/casino/providers:
    get:
      tags: [Casino]
      security: []
      summary: List enabled public catalogue providers
      responses:
        '200':
          description: Public providers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProvidersResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: cursor
          in: query
          required: false
          schema:
            type:
              - string
              - 'null'
            maxLength: 2048
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      operationId: getCasinoProviders
  /api/v1/casino/games:
    get:
      tags: [Casino]
      security: []
      summary: Search the local normalized catalogue; never call vendor for each card
      parameters:
        - {name: category, in: query, schema: {type: string, maxLength: 80}}
        - {name: provider, in: query, schema: {type: string, maxLength: 80}}
        - {name: query, in: query, schema: {type: string, maxLength: 100}}
        - {name: mode, in: query, schema: {type: string, enum: [demo, real]}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 24}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
        - $ref: '#/components/parameters/XRequestId'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Cacheable local catalogue page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GamesResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400': {$ref: '#/components/responses/ValidationError'}
      operationId: getCasinoGames
      description: Every GameSummary includes its stable slug, provider and full categories[] set; legacy 
        category is deprecated.
  /api/v1/casino/games/by-slug/{slug}:
    get:
      tags:
        - Casino
      summary: Resolve a public game slug
      description: Resolves the stable public slug used by current URLs, including persisted legacy storefront aliases, to the normalized game UUID and complete categories list. Legacy aliases are resolved only when an exact title/provider match is unique; unresolved aliases fail closed and ambiguous aliases return 409. Slug resolution is read-only and applies the catalogue visibility/availability policy.
      operationId: getCasinoGameBySlug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Normalized game resolved from slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/casino/games/{gameId}:
    parameters:
      - name: gameId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Casino]
      security: []
      summary: Fetch a local game record
      responses:
        '200':
          description: Local game detail.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GameResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '404': {$ref: '#/components/responses/NotFound'}
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      operationId: getCasinoGamesByGameId
  /api/v1/casino/games/{gameId}/demo-launch:
    parameters:
      - name: gameId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Casino]
      security: []
      summary: Ask the server to create a virtual/demo launch
      description: Demo launch has no reference to a real wallet. Guest use is a product decision.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                language: {$ref: '#/components/schemas/LanguageCode', description: 'Optional per-session language
                    override. If omitted, server uses the saved player preference; unsupported provider language
                    falls back to en.'}
                returnTo: {type: string, maxLength: 200, pattern: '^/(?!/)', description: 'Same-origin relative path only. Server also rejects backslashes, control characters, protocol-relative paths and encoded open-redirect variants.'}
      responses:
        '201':
          description: Demo launch URL and Bclick session reference.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LaunchResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      operationId: postCasinoGamesByGameIdDemoLaunch
  /api/v1/casino/games/{gameId}/launch:
    parameters:
      - name: gameId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Casino]
      summary: Authorize and start a real-money session
      description: Server derives player, checks eligibility and settlement currency and keeps provider 
        credentials private.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                language: {$ref: '#/components/schemas/LanguageCode', description: 'Optional per-session language
                    override. If omitted, server uses the saved player preference; unsupported provider language
                    falls back to en.'}
                device: {type: string, enum: [desktop, mobile]}
                returnTo: {type: string, maxLength: 200, pattern: '^/(?!/)', description: 'Same-origin relative path only. Server also rejects backslashes, control characters, protocol-relative paths and encoded open-redirect variants.'}
      responses:
        '201':
          description: Launch URL and Bclick session reference.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LaunchResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: CURRENCY_NOT_SUPPORTED_BY_PROVIDER when no active provider/game route supports the player's settlement currency; no conversion or launch call is attempted.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      operationId: postCasinoGamesByGameIdLaunch
  /api/v1/sportsbook/bootstrap:
    get:
      tags: [Sportsbook]
      summary: Build an authorized WinHouse embed bootstrap for the current player
      responses:
        '200':
          description: Short-lived signed launch token/loader metadata; never wallet secret.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SportsbookBootstrapResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422':
          description: CURRENCY_NOT_SUPPORTED_BY_PROVIDER when no active WinHouse tenant matches the player's settlement currency; never fall back to a different-currency tenant.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      operationId: getSportsbookBootstrap
  /api/v1/player/bet-slips:
    get:
      tags: [Sportsbook]
      summary: List the authenticated player's WinHouse bet slips
      description: Backend must always set provider player_id from the authenticated player's mapping.
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [open, pending, won, lost, cashed_out, 
                  cancelled, rejected]}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, description: Exclusive placement time, schema: {type: string, format: 
              date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
        - $ref: '#/components/parameters/XRequestId'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Player-owned tickets plus freshness metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BetSlipsResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      operationId: getPlayerBetSlips
  /api/v1/player/bet-slips/{ticketId}:
    parameters:
      - name: ticketId
        in: path
        required: true
        schema: {type: string, maxLength: 128}
    get:
      tags: [Sportsbook]
      summary: Fetch one slip after validating ownership
      responses:
        '200':
          description: Ticket detail.
          content:
            application/json:
