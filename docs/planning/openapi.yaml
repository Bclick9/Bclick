    PaymentCreateRequest:
      type: object
      additionalProperties: false
      required: [amount, currency, methodCode]
      properties:
        amount:
          $ref: '#/components/schemas/PositiveAmount'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        methodCode:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          description: Stable Bclick payment-method code, e.g. d17_tnd. Never a provider credential or display label.
        playerNote: {type: string, maxLength: 500}
        destinationAccountIdentifier:
          type: string
          minLength: 4
          maxLength: 512
          description: Required for withdrawal when no verified saved beneficiary account is selected.
        savedWithdrawalAccountId: {type: string, format: uuid, deprecated: true, description: "Reserved for future only (x-feature-status: future). The current API must reject this field until saved_withdrawal_accounts storage and ownership verification are implemented."}
        returnUrl:
          type: string
          maxLength: 200
          pattern: '^/(?!/)'
          description: Future automated PSP return path only. Same-origin relative path beginning with one slash; reject backslashes, control characters, protocol-relative URLs and encoded open-redirect variants. Cannot control settlement.
      description: Request amount is strictly positive and an exact decimal string at the enabled currency exponent. Idempotency-Key is required as an HTTP header and is the only idempotency-key source; request bodies do not repeat it. For withdrawals exactly one of destinationAccountIdentifier and savedWithdrawalAccountId is required.
    WithdrawalCreateRequest:
      allOf:
        - $ref: '#/components/schemas/PaymentCreateRequest'
        - type: object
          properties:
            destinationAccountIdentifier: {type: string, minLength: 4, maxLength: 512}
            savedWithdrawalAccountId: {type: string, format: uuid, deprecated: true, description: "Reserved for future only (x-feature-status: future). The current API must reject this field until saved_withdrawal_accounts storage and ownership verification are implemented."}
          oneOf:
            - required: [destinationAccountIdentifier]
            - required: [savedWithdrawalAccountId]
      description: Current rollout requires destinationAccountIdentifier; savedWithdrawalAccountId is reserved for future and must be rejected until verified saved-beneficiary persistence exists. Exactly one supported beneficiary is validated server-side; create holds atomically after KYC/RG/AML/bonus/dispute eligibility checks.
    PaymentIntentResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [id, direction, status, amount, currency, createdAt, proofUploads]
          properties:
            id: {type: string, format: uuid}
            direction: {type: string, enum: [deposit, withdrawal]}
            methodCode: {type: string, description: Stable Bclick payment method code.}
            status: {type: string, enum: [created, requires_action, pending, awaiting_proof, awaiting_scan, pending_review, more_info_requested, quarantined, approved, processing, succeeded, settled, failed, rejected, released, expired, refunded, cancelled, reversed, exception], description: Direction/method-specific states share this public union. Only a posted ledger journal determines spendable credit/settlement; reversed is a compensating business fact and never rewrites original entries.}
            amount: {$ref: '#/components/schemas/PositiveAmount'}
            expectedAmount: {$ref: '#/components/schemas/PositiveAmount'}
            heldAmount: {type: [string, 'null'], pattern: '^[0-9]+(\.[0-9]+)?$', description: "Amount currently held for this withdrawal, exact decimal string."}
            creditedAmount: {type: [string, 'null'], pattern: '^[0-9]+(\.[0-9]+)?$', description: "Amount actually posted to player-available, not the raw observed receipt amount."}
            currency: {$ref: '#/components/schemas/CurrencyCode'}
            fee: {type: [string, 'null'], pattern: '^[0-9]+(\.[0-9]+)?$', description: Disclosed fee amount in the currency specified by the method terms.}
            redirectUrl: {type: [string, 'null'], format: uri, description: Future automated PSP URL only; never evidence of settlement.}
            referenceCode: {type: [string, 'null'], pattern: '^BCL-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$', description: Manual deposit reference; globally unique and never reusable.}
            destinationAccount:
              type: [object, 'null']
              additionalProperties: false
              required: [identifier, instructions]
              properties:
                identifier: {type: string, description: Player-visible account identifier only; no internal destination account ID.}
                network: {type: [string, 'null']}
                qrPayload: {type: [string, 'null'], maxLength: 2048}
                instructions: {type: string, maxLength: 4000}
            expiresAt: {type: [string, 'null'], format: date-time}
            rejectionReason: {type: [string, 'null'], maxLength: 1000, description: Player-safe reason only; never internal admin notes or reviewer identity.}
            proofUploads:
              type: array
              description: Always returned as an array (empty when no proof has been uploaded); player-safe proof uploads attached to this intent, excluding storage keys, scanner diagnostics and reviewer identity.
              items:
                type: object
                additionalProperties: false
                required: [proofId, status, uploadedAt]
                properties:
                  proofId: {type: string, format: uuid}
                  status: {type: string, enum: [awaiting_scan, pending_review, quarantined, accepted, rejected]}
                  uploadedAt: {type: string, format: date-time}
            timeline:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [status, occurredAt]
                properties:
                  status: {type: string}
                  occurredAt: {type: string, format: date-time}
                  playerMessage: {type: [string, 'null'], maxLength: 500}
            createdAt: {type: string, format: date-time}
          description: Direction-specific fields are populated only when applicable. Never return internal notes, proof object keys, reviewer identity or the unapproved observed amount to the player. A manual deposit create response includes its immutable destination, reference and expiry; a withdrawal response includes the held amount.
        requestId: {type: string}
      description: Single canonical envelope for player-visible payment intents; `data.direction` distinguishes deposit and withdrawal while method-specific fields remain optional/null.

