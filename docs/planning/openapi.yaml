  /api/v1/admin/auth/login:
    post:
      tags:
        - Backoffice
      summary: Begin admin authentication
      description: Validate password and return an MFA challenge; never issue a full admin session before a valid TOTP or one-time recovery code. If MFA is not enrolled, return an enrollment-only cookie plus the signed JavaScript-readable __Host-bclick_admin_enrollment_csrf cookie bound to the enrollment challenge; restrict both to the enrollment flow. Limit to 5 attempts per 15 minutes per normalized admin identity 
        and 20 per 15 minutes per IP.
      operationId: postAdminAuthLogin
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '202':
          description: Password accepted; MFA verification or one-time enrollment is required. Emit the short-lived HttpOnly __Host-bclick_admin_enrollment cookie and JavaScript-readable __Host-bclick_admin_enrollment_csrf cookie only when response data.status is enrollment_required; bind the latter to that one-time enrollment challenge and use it in X-CSRF-Token only on TOTP enrollment endpoints. When data.status is mfa_required, neither enrollment cookie is emitted.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AdminEnrollmentCookie'
            X-CSRF-Token-Source:
              description: For an enrollment_required response, name of the enrollment-only readable CSRF cookie to copy to X-CSRF-Token; no token value is returned in this header.
              schema: {type: string, const: '__Host-bclick_admin_enrollment_csrf'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/auth/mfa/verify:
    post:
      tags:
        - Backoffice
      summary: Complete admin MFA authentication
      description: >-
        Consume a short-lived one-time challenge with a TOTP code or a single-use recovery code. The `challengeId`
        is only a locator, not a bearer secret; require the browser-bound `__Host-bclick_admin_challenge` cookie
        and verify its hash in the same one-time challenge record. On success create the opaque
        `__Host-bclick_admin_session` cookie, clear the challenge cookie, issue a fresh admin CSRF cookie, and
        write a security audit event. The challenge expires within five minutes and has bounded attempts.
      operationId: postAdminAuthMfaVerify
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMfaVerifyRequest'
      responses:
        '200':
          description: MFA verified; full admin session created.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AdminSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/auth/mfa/totp/setup:
    post:
      tags:
        - Backoffice
      summary: Start admin TOTP enrollment
      description: Requires an authenticated admin session with recent password re-authentication, or the 
        short-lived adminEnrollment cookie. Returns the secret/otpauth URI once only. Do not log or persist 
        the plaintext secret; store only an encrypted secret at rest. Enrollment-only sessions cannot access 
        any Backoffice data.
      operationId: postAdminTotpSetup
      security:
        - adminSession: []
        - adminEnrollment: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Pending TOTP secret generated; not active until verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTotpSetupResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/auth/mfa/totp/verify:
    post:
      tags:
        - Backoffice
      summary: Verify and activate admin TOTP
      description: Verifies a code for the pending secret and enables TOTP. When authenticated only by the
        restricted adminEnrollment cookie, success atomically consumes the enrollment challenge, clears
        __Host-bclick_admin_enrollment and __Host-bclick_admin_enrollment_csrf, creates the full admin session,
        and emits __Host-bclick_admin_session plus a fresh __Host-bclick_admin_csrf. The old enrollment token
        is invalid immediately. When called from an existing full admin session, rotate the admin CSRF token
        after the factor/privilege change and retain the existing authorization boundary.
      operationId: postAdminTotpVerify
      security:
        - adminSession: []
        - adminEnrollment: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTotpVerifyRequest'
      responses:
        '204':
          description: TOTP verified and enabled; enrollment credentials are revoked and the appropriate full-session CSRF context is rotated/issued.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AdminSessionCookie'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/auth/mfa/recovery-codes:
    post:
      tags:
        - Backoffice
      summary: Regenerate admin MFA recovery codes
      description: Requires full admin session, recent re-authentication and valid TOTP step-up. Invalidates 
        every previous recovery code; return new codes once only and store only salted hashes. Audit actor and
        outcome, never the codes.
      operationId: postAdminMfaRecoveryCodes
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMfaStepUpRequest'
      responses:
        '200':
          description: New recovery codes returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRecoveryCodesResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/auth/logout:
    post:
      tags:
        - Backoffice
      summary: Revoke admin session
      description: Revokes the server-side admin session, clears __Host-bclick_admin_session and __Host-bclick_admin_csrf, and records a 
        security audit event.
      operationId: postAdminAuthLogout
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Admin session revoked; __Host-bclick_admin_session and __Host-bclick_admin_csrf expired.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ExpiredAdminSessionCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/session:
    get:
      tags:
        - Backoffice
      summary: Get the current admin session and permissions
      description: Authoritative bootstrap endpoint for AdminAuthContext. Returns admin identity, effective 
        permission strings, roles, MFA state and expiry. Permissions are server-computed; frontend flags are 
        presentation only.
      operationId: getAdminSession
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Authenticated admin session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/media:
    post:
      tags:
        - Backoffice
      summary: Upload a CMS media asset
      description: Requires cms.media.write. Upload image bytes to quarantine/object storage, not PostgreSQL. 
        Allow JPEG, PNG, WebP and AVIF only; reject SVG and active content. Enforce maximum 10 MiB, inspect 
        magic bytes not only browser MIME, decode/re-encode image, bound dimensions/pixels, malware scan, 
        strip EXIF/metadata and publish only after scan succeeds. Fail closed if scanner/storage is 
        unavailable; never trust the filename or Content-Type supplied by the browser.
      operationId: postAdminMedia
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Image upload; maximum 10 MiB before decode/re-encode.
      responses:
        '201':
          description: Image validated and safe object stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMediaUploadResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Upload exceeds the configured byte or decoded-pixel limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: MIME or detected file type is not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Image failed decode/re-encode or malware validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/cms/{resource}/{resourceId}/preview:
    post:
      tags:
        - Backoffice
      summary: Preview an unpublished CMS resource
      description: Requires cms.write. Render a draft in an authenticated, no-index preview with short expiry.
        Does not publish, change current public cache, or expose a reusable public URL. Validate locale 
        against the CMS allowlist.
      operationId: postAdminCmsPreview
      security:
        - adminSession: []
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum:
              - banners
              - promotions
              - pages
              - skin-games
              - categories
              - providers
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                locale:
                  $ref: '#/components/schemas/CmsLocale'
      responses:
        '200':
          description: Short-lived authenticated preview metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCmsPreviewResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/cms/{resource}/{resourceId}/submit-for-approval:
    post:
      tags:
        - Backoffice
      summary: Submit a CMS draft for approval
      description: Requires Idempotency-Key and If-Match for the current ETag.  Requires cms.write and an audit reason. Creates an immutable draft revision for review; 
        author cannot approve their own revision. The resource is not publicly visible until independent 
        approval and publish.
      operationId: postAdminCmsSubmitForApproval
      security:
        - adminSession: []
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum:
              - banners
              - promotions
              - pages
              - skin-games
              - categories
              - providers
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCmsSubmissionRequest'
      responses:
        '202':
          description: Revision queued for independent approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCmsApprovalResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412': {description: If-Match is stale; re-fetch the current ETag and re-evaluate the action.}
  /api/v1/admin/cms/{resource}/{resourceId}/approval:
    post:
      tags:
        - Backoffice
      summary: Approve or reject a CMS revision
      description: Requires Idempotency-Key and If-Match for the exact revision being reviewed.  Requires cms.approve, an audit reason, and actor distinct from the revision author. 
        Approval freezes a revision; publishing remains a separate explicit action using the current ETag.
      operationId: postAdminCmsApproval
      security:
        - adminSession: []
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum:
              - banners
              - promotions
              - pages
              - skin-games
              - categories
              - providers
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCmsApprovalRequest'
      responses:
        '200':
          description: Decision recorded with immutable audit trail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCmsApprovalResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412': {description: If-Match is stale; re-fetch the current ETag and re-evaluate the action.}
  /api/v1/admin/players:
    get:
      tags: [Backoffice]
      summary: Search and filter player directory
      description: Requires players.read; server-enforced RBAC.
      security: [adminSession: []]
      parameters:
        - {name: query, in: query, schema: {type: string, maxLength: 100}}
        - {name: status, in: query, schema: {type: string, enum: [active, suspended, closed, pending]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - $ref: '#/components/parameters/XRequestId'
        - name: cursor
          in: query
          required: false
          schema:
            type:
              - string
              - 'null'
            maxLength: 2048
      responses:
        '200':
          description: Paginated player summaries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminPlayersResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: getAdminPlayers
  /api/v1/admin/bigbang/settings:
    get:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: Read BigBang integration controls
      description: Requires casino.provider-settings.manage. Current implementation is restricted to Standard Sandbox; Premium is unavailable and cannot be selected.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Current BigBang tier and last successful catalogue sync status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BigBangAdminSettingsResponse'}
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {description: Integration settings have not been initialized.}
      operationId: getAdminBigBangSettings
  /api/v1/admin/bigbang/providers:
    get:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: List BigBang providers and Bclick availability controls
      description: Requires casino.provider-settings.manage. Counts distinguish vendor/source availability from Bclick's own switches.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Providers with imported BigBang source rows and per-tier Bclick availability controls. Premium remains unavailable in the current Sandbox integration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BigBangAdminProvidersResponse'}
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: getAdminBigBangProviders
  /api/v1/admin/bigbang/providers/{providerCode}:
    parameters:
      - name: providerCode
        in: path
        required: true
        schema: {type: string, minLength: 1, maxLength: 120, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
      - $ref: '#/components/parameters/XRequestId'
    patch:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: Enable or disable a BigBang provider in Bclick
      description: Requires casino.provider-settings.manage, a fully authenticated MFA admin session, exact allowed Origin, and the admin CSRF token. This does not alter vendor source availability. The state change and audit record are atomic.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BigBangAdminControlPatchRequest'}
      responses:
        '200':
          description: Provider control updated and audited.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BigBangAdminProviderControlResponse'}
        '400': {description: Invalid provider code or request body.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {description: Update or audit persistence failed; the mutation is not reported as successful.}
      operationId: patchAdminBigBangProvider
  /api/v1/admin/bigbang/providers/{providerCode}/tiers/{mode}:
    parameters:
      - {name: providerCode, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 120, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}}
      - {name: mode, in: path, required: true, schema: {type: string, enum: [standard, premium]}}
      - $ref: '#/components/parameters/XRequestId'
    patch:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: Enable or disable a provider source tier
      description: Requires casino.provider-settings.manage, MFA, Origin and CSRF. Standard is available for the current Sandbox adapter. Premium deliberately returns 409 until authorized Premium sync and launch support are implemented.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BigBangAdminControlPatchRequest'}
      responses:
        '200':
          description: Source-tier control updated and audited.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [code, mode, enabled, updatedAt]
                    properties:
                      code: {type: string}
                      mode: {type: string, enum: [standard, premium]}
                      enabled: {type: boolean}
                      updatedAt: {type: string, format: date-time}
                  requestId: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Premium tier is not enabled for the current integration.}
      operationId: patchAdminBigBangProviderTier
  /api/v1/admin/bigbang/games:
    get:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: Search Standard BigBang games and Bclick availability controls
