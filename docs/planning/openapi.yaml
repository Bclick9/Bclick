  /callbacks/bigbang/user-data:
    get:
      tags: [Provider callbacks]
      security: []
      summary: BigBang seamless-wallet balance lookup callback
      description: >-
        Bclick-hosted callback. Published HTML documents GET query username and a balance/currency response.
        Verify the exact full BIGBANG_AGENT.md and tenant callback contract before implementation. No
        cache.
      parameters:
        - {name: username, in: query, required: true, schema: {type: string, maxLength: 255}}
      responses:
        '200':
          description: Provider-compatible balance response; exact envelope from BigBang contract.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BigBangUserDataResponse'}
        '4XX': {description: Provider-specific refusal; response status must follow current contract.}
        '5XX': {description: Provider-specific retriable failure where contract expects it.}
      operationId: getCallbackBigbangUserData
    servers:
      - url: https://api.example.invalid
        description: Unversioned callback origin; replace with approved production callback origin.
    description: Unversioned external callback endpoint. This path is intentionally outside /api/v1; 
      response/signature semantics must match the registered provider contract.
  /callbacks/bigbang/balance-change:
    post:
      tags: [Provider callbacks]
      security: []
      summary: BigBang signed wallet movement callback
      description: >-
        Confirm base signature plus optional X-Body-Signature/gross-field rules against the complete current
        vendor agent
        document. The known base HMAC concatenation is documented in provider-integrations.md. Do not
        cache or wrap the response.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BigBangBalanceChangeRequest'}
      responses:
        '200':
          description: Provider-compatible accepted response containing resulting balance; exact envelope to 
            be verified.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BigBangBalanceChangeResponse'}
        '4XX': {description: Response must match provider's documented business refusal/final status 
            semantics.}
        '5XX': {description: Retriable server/dependency failure only as defined by vendor contract.}
      operationId: postCallbackBigbangBalanceChange
    servers:
      - url: https://api.example.invalid
        description: Unversioned callback origin; replace with approved production callback origin.
    description: Unversioned external callback endpoint. This path is intentionally outside /api/v1; 
      response/signature semantics must match the registered provider contract.
  /callbacks/winhouse/user-data:
    get:
      tags: [Provider callbacks]
      security: []
      summary: WinHouse seamless-wallet user-data callback
      description: Validate the configured query callback token using the exact WinHouse contract; return the 
        authoritative local wallet balance and the player’s configured settlement currency. The callback token
        and wallet API key are separate secrets. Never log query tokens.
      parameters:
        - {name: token, in: query, required: true, schema: {type: string, minLength: 16, maxLength: 512}}
        - {name: username, in: query, required: true, schema: {type: string, maxLength: 255}}
      responses:
        '200':
          description: Provider response containing username, balance and currency.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WinHouseUserDataResponse'}
        '401':
          description: Invalid callback token; exact refusal response must match the approved WinHouse 
            contract.
        '5XX': {description: Retriable failure per vendor callback behavior.}
      operationId: getCallbackWinhouseUserData
    servers:
      - url: https://api.example.invalid
        description: Unversioned callback origin; replace with approved production callback origin.
    description: Unversioned external callback endpoint. This path is intentionally outside /api/v1; 
      response/signature semantics must match the registered provider contract.
  /callbacks/winhouse/balance-change:
    post:
      tags: [Provider callbacks]
      security: []
      summary: WinHouse signed wallet movement callback
      description: Validate the callback token and the wallet API HMAC separately, using exact 
        vendor-prescribed field order/stringification and a raw-body/lexeme-preserving parser. Apply 
        environment, stable player mapping, session, currency, idempotency and overdraft rules atomically. 
        Never expose either secret to the browser.
      parameters:
        - {name: token, in: query, required: true, schema: {type: string, minLength: 16, maxLength: 512}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WinHouseBalanceChangeRequest'}
      responses:
        '200':
          description: Accepted and committed response with current balance.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WinHouseBalanceChangeResponse'}
        '409': {description: 'Same transaction ID with conflicting payload, as documented by WinHouse.'}
        '422': {description: Insufficient funds/business refusal per documented WinHouse semantics.}
        '5XX': {description: Retriable server/dependency failure.}
      operationId: postCallbackWinhouseBalanceChange
    servers:
      - url: https://api.example.invalid
        description: Unversioned callback origin; replace with approved production callback origin.
    description: Unversioned external callback endpoint. This path is intentionally outside /api/v1; 
      response/signature semantics must match the registered provider contract.
