      items:
        $ref: '#/components/schemas/CspReportToEntry'
      maxItems: 20
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
      description: Admin password authentication starts a short-lived MFA challenge; no full session is issued
        by this request.
    AdminLoginResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - requestId
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
            - challengeId
            - expiresAt
          properties:
            status:
              type: string
              enum:
                - mfa_required
                - enrollment_required
            challengeId:
              type: string
              format: uuid
              description: Locator only, not a bearer secret. The request must also present the HttpOnly browser-bound admin challenge cookie issued with this response.
            expiresAt:
              type: string
              format: date-time
          description: No admin permissions/session until a factor is verified. A short-lived HttpOnly browser-binding cookie is issued for every accepted password challenge. Enrollment cookies are issued only for enrollment_required.
        requestId:
          type: string
      description: Password step result only; not proof of completed admin authentication.
    AdminMfaVerifyRequest:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - factor
        - code
      properties:
        challengeId:
          type: string
          format: uuid
        factor:
          type: string
          enum:
            - totp
            - recovery_code
        code:
          type: string
          minLength: 6
          maxLength: 64
      description: challengeId is a locator only, not a bearer secret; the browser must also present the HttpOnly __Host-bclick_admin_challenge cookie whose hash is bound to the challenge. TOTP codes are short numeric codes; recovery codes are one-time high-entropy codes. Both are rate limited; challenge consumption is atomic and recovery codes are consumed once.
    AdminSessionResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - requestId
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - admin
            - roles
            - permissions
            - mfa
            - session
          properties:
            admin:
              type: object
              additionalProperties: false
              required:
                - id
                - email
                - displayName
                - status
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 120
                status:
                  type: string
                  const: active
            roles:
              type: array
              uniqueItems: true
              items:
                type: string
                maxLength: 80
            permissions:
              type: array
              uniqueItems: true
              items:
                type: string
                maxLength: 120
              description: Effective permissions computed server-side; the client uses them only to control 
                presentation.
            mfa:
              type: object
              additionalProperties: false
              required:
                - enabled
                - method
              properties:
                enabled:
                  type: boolean
                  const: true
                method:
                  type: string
                  const: totp
            session:
              type: object
              additionalProperties: false
              required:
                - authenticatedAt
                - expiresAt
              properties:
                authenticatedAt:
                  type: string
                  format: date-time
                expiresAt:
                  type: string
                  format: date-time
        requestId:
          type: string
      description: Authoritative response for AdminAuthContext. Never treat a client-supplied permission list 
        as authorization.
    AdminTotpSetupResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - requestId
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - secret
            - otpauthUri
            - expiresAt
          properties:
            secret:
