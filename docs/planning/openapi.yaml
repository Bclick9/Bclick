x-planning-notes:
  - This contract is proposed and has no implemented route handlers.
  - Update server URL and error/callback rules after product and vendor approval.
  - Never treat a sample vendor response as proof of TND support, precise settlement, or callback retry 
    guarantee.
x-csrf-policy:
  appliesTo: Every cookie-authenticated unsafe method (POST, PUT, PATCH, DELETE), scoped to playerSession, adminSession, or the restricted adminEnrollment challenge; each context accepts only its own CSRF cookie.
  mechanism: Signed double-submit cookie, cryptographically bound to the active server-side session ID/version or the one-time enrollment challenge. CSRF cookies are Secure; SameSite=Strict; Path=/; no Domain; JavaScript-readable (not HttpOnly). The __Host- prefix requires Secure, Path=/, and no Domain. Session cookies remain Secure and HttpOnly. Cookie scope is host-based, not port-based; same-host localhost development therefore requires distinct names, and production must not assume separate subdomains.
  header: X-CSRF-Token must exactly match the CSRF cookie selected for the authenticated context and validate its signature/binding. Missing, mismatched, malformed, duplicate, expired, revoked, cross-context, or wrong-session tokens return 403 CSRF_INVALID. Validate token length/format before constant-time comparison; never log tokens.
  origin: Strict exact per-environment Origin allowlist for all unsafe cookie-authenticated requests and for unauthenticated login/register/reset endpoints; no wildcard. SameSite is defense-in-depth, not a substitute. Provider callbacks use their own authentication and are outside cookie CSRF.
  cookies:
    player:
      name: __Host-bclick_player_csrf
      issuedOn: Successful player login/session establishment. If registration issues an authenticated player session, emit this cookie atomically with that session too.
      boundTo: Exact player server-side session ID/version.
      rotateOn: [player session rotation, player privilege change]
      deletedOn: [player logout, player session revocation, session expiry]
      attributes: Secure; SameSite=Strict; Path=/; no Domain; JavaScript-readable; not HttpOnly.
    admin:
      name: __Host-bclick_admin_csrf
      issuedOn: Successful admin MFA verification, atomically with the full __Host-bclick_admin_session.
      boundTo: Exact full admin server-side session ID/version; never an MFA challenge.
      rotateOn: [admin session rotation, admin privilege change]
      deletedOn: [admin logout, admin session revocation, session expiry]
      attributes: Secure; SameSite=Strict; Path=/; no Domain; JavaScript-readable; not HttpOnly.
    enrollment:
      name: __Host-bclick_admin_enrollment_csrf
      issuedOn: Admin password step only when response status is enrollment_required, paired with the short-lived __Host-bclick_admin_enrollment cookie.
      boundTo: Exact one-time restricted enrollment challenge; may authorize only TOTP enrollment endpoints.
      rotateOn: [successful TOTP verification (revoke enrollment token and issue a new admin token), challenge renewal with prior token invalidated]
      deletedOn: [enrollment expiry, enrollment cookie revocation, successful TOTP verification]
      onTotpVerify: Revoke/delete enrollment cookie and CSRF token, then issue a fresh admin session and CSRF cookie only after TOTP succeeds; reject the prior enrollment token immediately.
      attributes: Secure; SameSite=Strict; Path=/; no Domain; JavaScript-readable; not HttpOnly.
  rotation: Rotate player/admin CSRF values on the respective session rotation or privilege change. Successful admin TOTP verification revokes enrollment CSRF and issues admin CSRF in the same successful session-establishment flow. Clear the matching context's CSRF cookie on logout/revocation; logout in one context must not clear another context's cookie.
  exceptions: Unauthenticated login, registration and reset requests do not require an authenticated CSRF token; they still require strict Origin policy, rate limits and abuse protection. Never accept a player token on admin routes, an admin token on player routes, or an enrollment token on full admin routes.
x-rate-limit-policy:
  login: 5 attempts per 15 minutes per normalized account identifier and 20 per 15 minutes per IP; progressive
    delay and generic errors.
  register: 5 registration attempts per hour per IP, plus CAPTCHA verification and risk-based velocity controls.
  passwordReset: 3 requests per hour per normalized account identifier and 10 per hour per IP; 
    account-enumeration-safe response.
  deposits: 10 intent-creation requests per 15 minutes per player and 30 per hour per IP; also enforce 
    pending-intent and monetary-risk limits.
  withdrawals: 5 intent-creation requests per 15 minutes per player and 15 per hour per IP; step-up and risk 
    checks apply.
  admin: 60 reads per minute per admin principal and 20 mutations per minute; sensitive MFA, permission and 
    export endpoints have tighter route-specific limits.
  adminMfa: 5 failed verifications per 15 minutes per admin/challenge plus 10 per IP; apply progressive delay and lock/expire the challenge after repeated failures. Recovery-code redemption is limited to 5 attempts per hour per admin; each code is single-use.
  mediaUploads: 10 media uploads per hour per admin and 30 per hour per IP; hard 10 MiB file cap, decoded-pixel cap, scanning queue backpressure and 429/Retry-After; scanner/storage unavailability fails closed.
  signedMediaUrls: signed proof/media URLs have a 5-minute initial TTL, are generated only after authorization, are individually scoped to one object/action, and are never logged.
  reportExports: 5 export requests per 15 minutes per admin, at most 2 concurrent active exports per admin and 5 per instance; all exports are capped at 10,000 rows and 20 MiB generated artifact in the initial release. Reject larger exports with 413 and ask for narrower filters; do not silently truncate. Export must be audited before any bytes are returned. Reject if limits or audit persistence cannot be enforced.
  note: Initial planning defaults, to be tuned from staging abuse/load tests and legal/payment obligations. 
    These are Bclick limits, not vendor guarantees; provider callback burst/timeout limits must follow vendor 
    contracts.

