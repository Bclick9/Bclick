  /callbacks/psp/{providerCode}:
    servers:
      - url: https://api.example.invalid
        description: Unversioned callback origin; replace with approved production callback origin.
    post:
      tags:
        - Provider callbacks
      summary: Receive selected PSP webhook
      operationId: ReceiveSelectedPspWebhook
      description: Bclick-owned adapter ingress placeholder. `providerCode` is configured server-side. Do not 
        accept this generic envelope as a valid payment until the selected PSP-specific signature, schema, 
        replay controls and status semantics have been implemented and tested. This route is outside /api/v1 
        so provider registrations survive internal API version upgrades.
      security: []
      parameters:
        - name: providerCode
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-z0-9-]{2,40}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PspCallbackEnvelope'
      responses:
        '200':
          description: Generic acknowledgment only; response contract must be specialized to selected PSP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PspCallbackAck'
        '400':
          description: Malformed event according to selected PSP adapter contract.
        '401':
          description: Signature/authentication refusal according to selected PSP adapter contract.
        '409':
          description: Conflicting duplicate event; exact response selected by PSP contract.
        '5XX':
          description: Retriable failure only when allowed by the selected PSP webhook contract.
    description: Unversioned external callback endpoint. This path is intentionally outside /api/v1; 
      response/signature semantics must match the registered provider contract.
  /api/v1/admin/cms/skin-games/{gameId}/reorder:
    patch:
      tags:
        - Backoffice
      security:
        - adminSession: []
      summary: Reorder a game within a CMS skin
      operationId: reorderCmsSkinGame
      description: Requires cms.write and an If-Match value for the current skin/order version. Changes 
        presentation order only; it does not alter provider game IDs or availability.
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - skinId
                - position
              properties:
                skinId:
                  type: string
                  format: uuid
                position:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Skin ordering updated; returns current ETag and audit metadata.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmsResourceResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch; re-fetch current order before retry.
        '428':
          description: If-Match is required.
  /csp-report:
    post:
      tags:
        - Security
      security: []
      summary: Receive minimized Content Security Policy reports
      operationId: receiveCspReport
      description: Unversioned, unauthenticated browser telemetry endpoint. Enforce a small body limit, strict
        allowlisted schema, IP rate limit, no cookie logging, query/URL redaction, and short retention. Never 
        use reports for application authorization.
      requestBody:
        required: true
        content:
          application/reports+json:
            schema:
              $ref: '#/components/schemas/CspReportToReport'
          application/csp-report:
            schema:
              $ref: '#/components/schemas/CspReportRequest'
      responses:
        '204':
          description: Report accepted or safely dropped.
        '400':
          description: Malformed report.
        '413':
          description: Report exceeds the small configured body limit.
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
        - $ref: '#/components/parameters/XRequestId'
  /api/v1/payments/methods:
    get:
      tags: [Payments]
      operationId: listAvailablePaymentMethods
      summary: List payment methods available to the current player
      description: Returns methods filtered by immutable player settlement currency, registration country, current KYC status/tier, self-exclusion/cooling-off, account status, jurisdiction, AML holds, direction and effective limits. Missing or disabled currency/country rules deny the method. Deposit/withdrawal handlers MUST call the same server-side eligibility service again at mutation time; a stale methods list is not authorization. Does not expose internal destination-account IDs or limits of other players.
      security: [{playerSession: []}]
      parameters:
        - {$ref: '#/components/parameters/XRequestId'}
        - name: direction
          in: query
          required: false
          description: Filter methods by transaction direction. If omitted, return methods eligible for at least one direction and expose their supported direction.
          schema: {type: string, enum: [deposit, withdrawal]}
      responses:
        '200':
          description: Eligible methods; no-store because eligibility is player-specific.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/PaymentMethodsResponse'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/payments/deposits/{paymentId}/proof:
    post:
      tags: [Payments]
      operationId: uploadPaymentDepositProof
      summary: Upload proof for a manual deposit intent
      description: Proof is a claim, not settlement evidence. Server validates ownership, state, byte signature, size, SHA-256 global uniqueness and malware scan before review; no wallet journal is posted by upload.
      security: [{playerSession: []}]
      parameters:
        - {name: paymentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: {file: {type: string, format: binary, description: "JPEG, PNG or PDF only; maximum 10 MiB before decoding."}}
      responses:
        '202':
          description: Accepted for scan/review; not a deposit confirmation.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/PaymentProofUploadResponse'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {description: File exceeds 10 MiB limit.}
        '415': {description: Unsupported or detected disallowed file type.}
        '422': {description: "Malware, duplicate hash, or image/PDF validation failure."}
        '429': {$ref: '#/components/responses/RateLimited'}
