        - {name: providerCode, in: query, schema: {type: string, minLength: 1, maxLength: 120, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}}
        - {name: query, in: query, schema: {type: string, maxLength: 100}}
