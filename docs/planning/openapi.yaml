  /api/v1/admin/casino/skin-games:
    get:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: List real catalogue variants for Skin Games
      description: Requires casino.provider-settings.manage. Each BigBang source-tier variant is represented by its own canonical Bclick UUID. Premium rows may be displayed read-only but remain unavailable until its integration gate is accepted.
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: query, in: query, schema: {type: string, maxLength: 120}}
        - {name: providerCode, in: query, schema: {type: string, minLength: 1, maxLength: 120}}
        - {name: category, in: query, schema: {type: string, minLength: 1, maxLength: 80}}
        - {name: sourceMode, in: query, schema: {type: string, enum: [standard, premium]}}
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Paginated canonical source variants and persisted presentation values.
          content:
            application/json:
              schema:
                type: object
                required: [data, page, integration, requestId]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, slug, title, provider, sourceMode, externalGameId, isPremium, sourceAvailable, catalogAvailable, enabled, providerEnabled, providerTierEnabled, effectiveAvailable, sourceImageUrl, customImageUrl, imageUrl, description, hasCustomDescription, displayOrder, categories, updatedAt, updatedBy]
                      properties:
                        id: {type: string, format: uuid}
                        slug: {type: string}
                        title: {type: string}
                        provider:
                          type: object
                          required: [code, name]
                          properties:
                            code: {type: string}
                            name: {type: string}
                        sourceMode: {type: string, enum: [standard, premium]}
                        externalGameId: {type: string}
                        isPremium: {type: boolean}
                        sourceAvailable: {type: boolean}
                        catalogAvailable: {type: boolean}
                        enabled: {type: boolean}
                        providerEnabled: {type: boolean}
                        providerTierEnabled: {type: boolean}
                        effectiveAvailable: {type: boolean}
                        sourceImageUrl: {type: [string, 'null'], format: uri}
                        customImageUrl: {type: [string, 'null']}
                        imageUrl: {type: [string, 'null']}
                        description: {type: string, maxLength: 2000}
                        hasCustomDescription: {type: boolean}
                        displayOrder: {type: integer, minimum: 0}
                        categories: {type: array, items: {type: string}}
                        updatedAt: {type: string, format: date-time}
                        updatedBy: {type: [string, 'null']}
                  page:
                    type: object
                    required: [page, pageSize, total, nextPage]
                    properties:
                      page: {type: integer, minimum: 1}
                      pageSize: {type: integer, minimum: 1, maximum: 100}
                      total: {type: integer, minimum: 0}
                      nextPage: {type: [integer, 'null'], minimum: 1}
                  integration:
                    type: object
                    required: [selectedTier, premiumAvailable, premiumReason]
                    properties:
                      selectedTier: {type: string, enum: [standard]}
                      premiumAvailable: {type: boolean, const: false}
                      premiumReason: {type: [string, 'null']}
                  requestId: {type: string}
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        '400': {description: Invalid filter or pagination parameters.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: getAdminSkinGames
  /api/v1/admin/casino/skin-games/reorder:
    patch:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: Persist order for two game variants in the same source tier
      description: Requires casino.provider-settings.manage, MFA, Origin and CSRF. Canonical UUIDs must belong to the same source tier; the order mutation and audit are atomic.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [gameId, targetGameId, position]
              properties:
                gameId: {type: string, format: uuid}
                targetGameId: {type: string, format: uuid}
                position: {type: string, enum: [before, after]}
      responses:
        '200':
          description: Display order persisted and audit record written.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [gameId, targetGameId, position, sourceMode, displayOrder]
                    properties:
                      gameId: {type: string, format: uuid}
                      targetGameId: {type: string, format: uuid}
                      position: {type: string, enum: [before, after]}
                      sourceMode: {type: string, enum: [standard, premium]}
                      displayOrder: {type: integer, minimum: 0}
                  requestId: {type: string}
        '400': {description: Invalid or identical canonical UUIDs.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      operationId: patchAdminSkinGamesReorder
  /api/v1/admin/casino/skin-games/{gameId}:
    parameters:
      - {name: gameId, in: path, required: true, schema: {type: string, format: uuid}}
      - $ref: '#/components/parameters/XRequestId'
    patch:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: Persist game availability and description override
      description: Requires casino.provider-settings.manage, MFA, Origin and CSRF. Provider-owned identity remains immutable. Premium mutations are locked.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                enabled: {type: boolean}
                description: {type: string, maxLength: 2000}
                clearCustomImage: {type: boolean}
      responses:
        '200':
          description: Availability or presentation update persisted with audit actor.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [id, slug, enabled, updatedAt]
                    properties:
                      id: {type: string, format: uuid}
                      slug: {type: string}
                      enabled: {type: boolean}
                      updatedAt: {type: string, format: date-time}
                  requestId: {type: string}
        '400': {description: Invalid game UUID or body.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Premium mutation or ineffective game enable was refused.}
      operationId: patchAdminSkinGame
  /api/v1/admin/casino/skin-games/{gameId}/image:
    parameters:
      - {name: gameId, in: path, required: true, schema: {type: string, format: uuid}}
      - $ref: '#/components/parameters/XRequestId'
    post:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: Upload persistent custom artwork for a canonical game UUID
      description: Requires casino.provider-settings.manage, MFA, Origin and CSRF. PNG/JPEG/WebP are validated from bytes, limited to 5 MiB, assigned a server-generated filename and stored on the configured persistent upload volume. blob URLs are never stored.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, format: binary}}
          image/jpeg: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
      responses:
        '201':
          description: Image stored persistently and audit record written.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [gameId, customImageUrl, contentType]
                    properties:
                      gameId: {type: string, format: uuid}
                      customImageUrl: {type: string, format: uri}
                      contentType: {type: string, enum: [image/png, image/jpeg, image/webp]}
                  requestId: {type: string}
        '400': {description: Invalid UUID.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Premium artwork edits are locked.}
        '413': {description: Image exceeds the 5 MiB limit.}
        '415': {description: Unsupported or invalid image bytes.}
      operationId: postAdminSkinGameImage
  /api/v1/assets/casino-games/{gameId}/{fileName}:
    get:
      tags: [Casino catalogue]
      summary: Read generated persistent game artwork
      description: Serves only the current custom image referenced by the catalogue record.
      parameters:
        - {name: gameId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: fileName, in: path, required: true, schema: {type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}\.(png|jpg|webp)$'}}
        - $ref: '#/components/parameters/XRequestId'
      responses:
