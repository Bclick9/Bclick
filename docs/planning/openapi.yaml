  /api/v1/admin/bonus-campaigns:
    get:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: List bonus campaign versions
      description: Requires bonuses.manage; drafts and private terms are admin-only.
      operationId: listAdminBonusCampaigns
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [draft, pending_review, scheduled, active, 
                  paused, ended, archived]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Campaigns and immutable versions; public CMS promotions are separate.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BonusCampaignsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: Create a draft bonus campaign
      description: Requires bonuses.manage and audit reason; draft has no player financial effect.
      operationId: createAdminBonusCampaign
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BonusCampaignDraftRequest'}
      responses:
        '201':
          description: Draft created; no player grant or ledger journal is created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BonusCampaignResponse'}
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/admin/bonus-campaigns/{campaignCode}:
    parameters:
      - name: campaignCode
        in: path
        required: true
        schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,79}$'}
    get:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: Read a bonus campaign version
      description: Requires bonuses.manage. Returns ETag for draft optimistic concurrency.
      operationId: getAdminBonusCampaign
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Current draft/active version metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BonusCampaignResponse'}
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: Update a draft campaign only
      description: Requires bonuses.manage; active version terms are immutable. ETag and If-Match prevent 
        stale draft overwrite.
      operationId: patchAdminBonusCampaign
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BonusCampaignDraftPatchRequest'}
      responses:
        '200':
          description: Draft updated; no player grant or ledger journal is created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BonusCampaignResponse'}
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {description: If-Match does not match current ETag.}
  /api/v1/admin/bonus-campaigns/{campaignCode}/publish:
    parameters:
      - name: campaignCode
        in: path
        required: true
        schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,79}$'}
    post:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: Publish a reviewed immutable campaign version
      description: Requires bonuses.manage, If-Match and Idempotency-Key. Production publication also requires
        the configured independent review when policy says so. Publishing changes eligibility for future 
        grants; it does not grant money.
      operationId: publishAdminBonusCampaign
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Campaign version published/activated according to its schedule; terms are now 
            immutable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BonusCampaignResponse'}
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {description: If-Match does not match current draft ETag.}
  /api/v1/admin/players/{playerId}/bonuses:
    parameters:
      - name: playerId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Backoffice]
      summary: Grant a Bclick-native bonus to a player
      description: Requires bonuses.grant and admin MFA/step-up. An immediately approved grant posts a 
        bonus_grant journal to a grant-specific restricted account; it does not increase cash available or 
        create a provider-funded wallet. If dual control is required, the grant remains pending and no journal
        is posted until approval. For provider feature grants use the separate feature-grant workflow.
      operationId: adminGrantPlayerBonus
      security: [adminSession: []]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminBonusGrantRequest'}
      responses:
        '201':
          description: Immediately approved bonus grant created; grant row and bonus_grant journal committed 
            atomically.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BonusGrantResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '202':
          description: Grant request awaits independent approval; no bonus journal is posted until approval 
            succeeds.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BonusGrantResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/BusinessRefusal'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/admin/bonus-grants/{grantId}/approval:
    parameters:
      - name: grantId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: Approve or reject a pending bonus grant
      description: Requires bonuses.grant.approve, independent administrator identity and a reason. Cannot 
        approve a grant created by the same admin. Approval posts the bonus_grant journal and activates the 
        grant atomically; rejection posts no journal.
      operationId: decideAdminBonusGrantApproval
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BonusGrantApprovalRequest'}
      responses:
        '200':
          description: Pending grant approved or rejected; resulting state and ledger reference are returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BonusGrantResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/admin/players/{playerId}/status:
    parameters:
      - name: playerId
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: Change player access status (players.status.write)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, reason]
              properties:
                status: {type: string, enum: [active, suspended, closing, closed]}
                reason: {type: string, minLength: 3, maxLength: 1000}
      responses:
        '200': {description: Player status changed; action is audited.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412':
          description: ETag mismatch; fetch latest player record before retry.
        '428':
          description: If-Match is required for this write.
      operationId: patchAdminPlayersByPlayerIdStatus
  /api/v1/admin/transactions:
    get:
