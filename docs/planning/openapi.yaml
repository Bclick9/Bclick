        as_of: {type: [string, 'null'], format: date-time, description: "If omitted, server freezes a UTC cutoff
            at request start and echoes it in audit."}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        groupBy:
          type: array
          maxItems: 3
          uniqueItems: true
          items: {type: string, enum: [day, week, month, ticketStatus, oddsBand, processingStatus, 
                  movementKind, linkedState, providerCode, gameId, gameType, roundStatus, journalType, 
                  accountKind, reconciliationStatus, paymentType, paymentStatus]}
        filters:
          $ref: '#/components/schemas/ReportExportFilters'
        format: {type: string, enum: [csv, xlsx]}
      description: Report-specific export body. The endpoint supplies report identity; filters and groupBy are
        validated against that report's allowlist. Synchronous export is capped at 10,000 rows and 20 MiB
        generated file size; larger requests return 413 and must be narrowed.
    AdjustmentRequest:
      type: object
      required:
        - playerId
        - currency
        - amount
        - reason
      properties:
        playerId: {type: string, format: uuid}
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        amount: {$ref: '#/components/schemas/DecimalAmount', description: 'Signed player-perspective amount: positive
            credits the player; negative debits the player. Approval validates policy and available funds before
            posting.'}
        reason: {type: string, minLength: 10, maxLength: 1000}
        relatedReference: {type: string, maxLength: 200}
      description: Creates a reviewable request; no balance mutation until a separate privileged approval 
        succeeds. Idempotency-Key is supplied only as a required HTTP header. Positive amount = credit to 
        player; negative amount = debit from player.
    CmsDraftRequest:
      type: object
      required: [slug, title, status, content]
      properties:
        slug: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        title: {type: string, minLength: 1, maxLength: 200}
        status: {type: string, enum: [draft, scheduled, published, archived]}
        locale: {$ref: '#/components/schemas/CmsLocale'}
        content: {type: object, additionalProperties: true}
        imageUrl: {type: [string, 'null'], format: uri}
        startsAt: {type: [string, 'null'], format: date-time}
        endsAt: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 1}
    LanguageCode:
      type: string
      pattern: '^[a-z]{2}$'
      description: Persisted lower-case ISO 639-1 player language code; runtime validates against the 
        supported UI languages.
      examples: [en, ar, fr]
    CmsLocale:
      type: string
      pattern: '^[a-z]{2}(?:-[A-Z]{2})?$'
      description: Supported CMS locale, allowing a language or language-region tag such as en or ar-TN; 
        runtime validates against published locales.
      examples: [en, fr-FR, ar-TN]
    CurrencyCode:
      type: string
      pattern: ^[A-Z]{3}$
      description: ISO-style 3-letter code; runtime must confirm currencies.enabled and provider/account 
        support. Adding a code does not require an OpenAPI enum change.
      examples:
        - TND
        - EUR
        - USD
    PositiveAmount:
      type: string
      minLength: 1
      maxLength: 32
      pattern: ^(?:[1-9][0-9]*(?:\.[0-9]+)?|0\.[0-9]*[1-9][0-9]*)$
      description: Strictly positive decimal string; no sign, exponent notation, or zero. Runtime enforces 
        exact currency exponent and product/provider limits.
    NonNegativeAmount:
      type: string
      minLength: 1
      maxLength: 32
      pattern: ^(?:0(?:\.[0-9]+)?|[1-9][0-9]*(?:\.[0-9]+)?)$
      description: Non-negative exact decimal string, including formatted zero values such as 0 and 0.00; no sign or exponent notation. Runtime enforces the enabled currency exponent.
      examples:
        - '0'
        - '0.00'
        - '12.34'
    ListPage:
      type: object
      description: Shared list pagination envelope. Cursor mode uses nextCursor; offset mode sets page and 
        total. Fields are optional when not supported by a particular list.
      properties:
        nextCursor:
          type:
            - string
            - 'null'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type:
            - integer
            - 'null'
          minimum: 0
    ListMeta:
      type: object
      description: Optional list metadata, such as provider cache freshness.
      properties:
        stale:
          type: boolean
        fetchedAt:
          type:
            - string
            - 'null'
          format: date-time
        resolvedLocale:
          oneOf:
            - $ref: '#/components/schemas/CmsLocale'
            - type: 'null'
          description: Locale actually served after translation fallback; present on localized CMS responses.
    CmsResponseMeta:
      type: object
      required: [resolvedLocale]
      properties:
        resolvedLocale:
          $ref: '#/components/schemas/CmsLocale'
        stale: {type: boolean}
        fetchedAt: {type: [string, 'null'], format: date-time}
      description: Required locale metadata for public localized CMS responses; resolvedLocale is the locale 
        actually served after deterministic fallback.
    AdminBonusGrantRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        campaignCode: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,79}$'}
        manualTerms:
          $ref: '#/components/schemas/ManualBonusTerms'
        reason: {type: string, minLength: 10, maxLength: 1000}
      oneOf:
        - required: [campaignCode]
        - required: [manualTerms]
      description: Grant either an active published campaign by code or a manual one-off grant with explicit 
        terms; do not provide both. Idempotency-Key is the sole idempotency key. Server checks player 
        eligibility, currency and all frozen terms before posting.
    ManualBonusTerms:
      type: object
      additionalProperties: false
      required: [value, currency, wagering, eligibleProducts, maxBet, expiresAt, termsVersion]
      properties:
        value: {$ref: '#/components/schemas/PositiveAmount'}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        wagering: {$ref: '#/components/schemas/BonusWageringRule'}
        eligibleProducts:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [casino, sportsbook]}
        maxBet: {$ref: '#/components/schemas/PositiveAmount'}
        winningsCap:
          oneOf:
            - $ref: '#/components/schemas/NonNegativeAmount'
            - type: 'null'
        expiresAt: {type: string, format: date-time}
        termsVersion: {type: string, minLength: 1, maxLength: 100}
      description: Exact one-off bonus terms. For deposit_plus_bonus, qualifying deposit is determined by a 
        separately verified source record, not from an arbitrary amount supplied by the admin client.
    BonusWageringRule:
      oneOf:
        - type: object
          additionalProperties: false
          required: [base, multiplier]
          properties:
            base: {type: string, const: bonus_only}
            multiplier: {type: integer, minimum: 0, maximum: 100}
        - type: object
          additionalProperties: false
          required: [base, multiplier]
          properties:
            base: {type: string, const: deposit_plus_bonus}
            multiplier: {type: integer, minimum: 0, maximum: 100}
        - type: object
          additionalProperties: false
          required: [base, fixedTurnoverAmount]
          properties:
            base: {type: string, const: fixed_turnover}
            fixedTurnoverAmount: {$ref: '#/components/schemas/PositiveAmount'}
      description: Versioned wagering requirement. Deposit-plus-bonus target uses a verified qualifying 
        deposit in the same player/currency; campaign policy determines which deposit is eligible.
    BonusCampaignDraftRequest:
      type: object
      additionalProperties: false
      required: [name, currency, value, eligibleProducts, wagering, contributionRules, maxBet, expiresInDays, 
            termsVersion, reason]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        value: {$ref: '#/components/schemas/PositiveAmount'}
        eligibleProducts:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [casino, sportsbook]}
        wagering: {$ref: '#/components/schemas/BonusWageringRule'}
        contributionRules:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [scope, contributionBps]
            properties:
              scope: {type: string, minLength: 1, maxLength: 200, description: 'Canonical normalized scope such
                  as casino:category:slots or sportsbook:default.'}
              contributionBps: {type: integer, minimum: 0, maximum: 10000}
        maxBet: {$ref: '#/components/schemas/PositiveAmount'}
        winningsCap:
          oneOf:
            - $ref: '#/components/schemas/NonNegativeAmount'
            - type: 'null'
        expiresInDays: {type: integer, minimum: 1, maximum: 365}
        termsVersion: {type: string, minLength: 1, maxLength: 100}
        reason: {type: string, minLength: 10, maxLength: 1000, description: Audit reason for creating or 
            updating the draft.}
      description: Draft-only campaign terms. An audit reason is required for each mutation. Publishing 
        freezes a new immutable campaign version; changing active terms requires a new version.
    BonusCampaignDraftPatchRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        value: {$ref: '#/components/schemas/PositiveAmount'}
        eligibleProducts:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [casino, sportsbook]}
        wagering: {$ref: '#/components/schemas/BonusWageringRule'}
        contributionRules:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [scope, contributionBps]
            properties:
              scope: {type: string, minLength: 1, maxLength: 200, description: 'Canonical normalized scope such
                  as casino:category:slots or sportsbook:default.'}
              contributionBps: {type: integer, minimum: 0, maximum: 10000}
        maxBet: {$ref: '#/components/schemas/PositiveAmount'}
        winningsCap:
          oneOf:
            - $ref: '#/components/schemas/NonNegativeAmount'
            - type: 'null'
        expiresInDays: {type: integer, minimum: 1, maximum: 365}
        termsVersion: {type: string, minLength: 1, maxLength: 100}
        reason: {type: string, minLength: 10, maxLength: 1000, description: Audit reason for this draft 
            update.}
      description: Partial update to a draft only. The audit reason is required. The service applies the patch
        to the stored draft, validates the complete resulting version, and refuses updates to a published 
        version.
    BonusCampaignSummary:
      type: object
      required: [campaignCode, version, name, currency, value, status, termsVersion, createdAt, updatedAt]
      properties:
        campaignCode: {type: string}
        version: {type: integer, minimum: 1}
        name: {type: string}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        value: {$ref: '#/components/schemas/PositiveAmount'}
        eligibleProducts:
          type: array
          items: {type: string, enum: [casino, sportsbook]}
        wagering: {$ref: '#/components/schemas/BonusWageringRule'}
        contributionRules:
          type: array
          items:
            type: object
            required: [scope, contributionBps]
            properties:
              scope: {type: string}
              contributionBps: {type: integer, minimum: 0, maximum: 10000}
        maxBet: {$ref: '#/components/schemas/PositiveAmount'}
        winningsCap:
          oneOf:
            - $ref: '#/components/schemas/NonNegativeAmount'
            - type: 'null'
        expiresInDays: {type: integer, minimum: 1, maximum: 365}
        status: {type: string, enum: [draft, pending_review, scheduled, active, paused, ended, archived]}
        termsVersion: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        publishedAt: {type: [string, 'null'], format: date-time}
    BonusCampaignResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: {$ref: '#/components/schemas/BonusCampaignSummary'}
        requestId: {type: string}
    BonusCampaignsResponse:
      type: object
      required: [data, page, requestId]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/BonusCampaignSummary'}}
        page: {$ref: '#/components/schemas/ListPage'}
        requestId: {type: string}
    BonusGrantApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision: {type: string, enum: [approve, reject]}
        reason: {type: string, minLength: 10, maxLength: 1000}
      description: Independent approval/rejection of a pending dual-control grant. An approval posts its 
        journal atomically; rejection never posts money.
    BonusGrantResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
