  /api/v1/admin/wallet-adjustment-requests:
    get:
      tags:
        - Backoffice
      summary: List wallet adjustment requests
      operationId: ListWalletAdjustmentRequests
      description: Requires wallet.adjust.request or wallet.adjust.approve; sensitive values are audited.
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: cursor
          in: query
          required: false
          schema:
            type:
              - string
              - 'null'
            maxLength: 2048
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletAdjustmentRequestsResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Backoffice
      security:
        - adminSession: []
      summary: Create a reviewable wallet adjustment request
      operationId: createWalletAdjustmentRequest
      description: Requires wallet.adjust.request and a reason. Does not change balance; a separate 
        authorized approver must approve. Idempotency-Key is required as a header. Positive amount credits the
        player; negative amount debits the player.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustmentRequest'
      responses:
        '201':
          description: Request created in pending state; no journal is posted yet.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletAdjustmentRequestResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/wallet-adjustment-requests/{adjustmentId}/approve:
    parameters:
      - name: adjustmentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: Approve an adjustment with separation of duties (wallet.adjust.approve)
      responses:
        '200': {description: Compensating journal posted and approval audited.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      operationId: postAdminWalletAdjustmentRequestsByAdjustmentIdApprove
  /api/v1/admin/cms/{resource}:
    parameters:
      - name: resource
        in: path
        required: true
        schema: {type: string, enum: [banners, promotions, pages, categories, providers, skins]}
    post:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: Create a CMS draft (cms.write)
      description: Requires cms.write and an Idempotency-Key. No If-Match is required because this creates a new draft and no current ETag exists; response establishes the ETag for subsequent updates.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CmsDraftRequest'}
      responses:
        '201': {description: Draft created; not public until approved/published.}
        '403': {$ref: '#/components/responses/Forbidden'}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      operationId: postAdminCmsByResource
  /api/v1/admin/cms/{resource}/{resourceId}:
    parameters:
      - name: resource
        in: path
        required: true
        schema: {type: string, enum: [banners, promotions, pages, categories, providers, skins]}
      - name: resourceId
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: Edit a CMS draft using optimistic concurrency (cms.write)
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CmsDraftRequest'}
      responses:
        '200': {description: Draft updated.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412':
          description: Precondition failed; re-fetch resource and resolve conflict.
        '428':
          description: If-Match required for this mutable resource.
      operationId: patchAdminCmsByResourceByResourceId
    get:
      tags:
        - Backoffice
      summary: Read a CMS resource
      operationId: ReadACmsResource
      description: Requires cms.write or cms.publish as appropriate. Draft detail includes version and audit 
        metadata. ETag is returned for subsequent If-Match writes. The generic resource path excludes 
        skin-games; game ordering is handled by the dedicated /api/v1/admin/cms/skin-games/{gameId}/reorder 
        route.
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            maxLength: 256
      responses:
        '200':
          description: CMS resource representation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmsResourceResponse'
        '304':
          description: Not modified.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: CMS resource not found.
  /api/v1/admin/cms/{resource}/{resourceId}/publish:
    parameters:
      - name: resource
        in: path
        required: true
        schema: {type: string, enum: [banners, promotions, pages, categories, providers, skins]}
      - name: resourceId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: Publish a reviewed CMS version (cms.publish)
      description: Requires cms.publish, Idempotency-Key, an audit reason, a previously approved immutable revision, and If-Match for the current resource ETag. A stale version returns 412.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200': {description: Published version recorded and audited; public cache invalidated.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {description: If-Match is stale; re-fetch the current ETag and re-evaluate the action.}
      operationId: postAdminCmsByResourceByResourceIdPublish
  /api/v1/admin/audit-events:
    get:
      tags: [Backoffice]
      security: [adminSession: []]
      summary: Read append-only admin/security/financial audit (audit.read)
      parameters:
        - {name: actorId, in: query, schema: {type: string, format: uuid}}
        - {name: targetId, in: query, schema: {type: string, format: uuid}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - $ref: '#/components/parameters/XRequestId'
        - name: cursor
          in: query
