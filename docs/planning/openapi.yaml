      operationId: reviewAdminPayment
      summary: Record a first-level human review
      description: Requires payments.review. Reviewer enters independently observed actual amount/reference and reason. Actor cannot review own payment. No settlement is inferred from a proof file.
      security: [{adminSession: []}]
      parameters:
        - {name: paymentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminPaymentReviewRequest'}}}
      responses:
        '200':
          description: Review decision recorded with actor, timestamp, reason and audit event.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/admin/payments/{paymentId}/approve:
    post:
      tags: [Payments]
      operationId: approveAdminPayment
      summary: Record distinct-principal second approval
      description: Requires payments.approve and recent MFA step-up. A principal cannot approve their own first decision; high-value flows require separation from execution.
      security: [{adminSession: []}]
      parameters:
        - {name: paymentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PaymentApprovalRequest'}}}
      responses:
        '200':
          description: Second approval recorded with distinct principal and audit trail.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/admin/payments/{paymentId}/reject:
    post:
      tags: [Payments]
      operationId: rejectAdminPayment
      summary: Reject a payment intent with reason
      description: Requires payments.review; a withdrawal hold is released only through a balanced withdrawal_released journal and only if no external payout may be in flight.
      security: [{adminSession: []}]
      parameters:
        - {name: paymentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PaymentRejectionRequest'}}}
      responses:
        '200':
          description: Rejection recorded; any safe hold release is journaled and audited.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/admin/payments/{paymentId}/mark-settled:
    post:
      tags: [Payments]
      operationId: markAdminPaymentSettled
      summary: Record verified external payout settlement
      description: Requires payments.execute and recent MFA step-up. The executor must be distinct from a required approver; a rail-specific transaction reference and proof are mandatory. State and journal commit exactly once.
      security: [{adminSession: []}]
      parameters:
        - {name: paymentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [txReference, txProof]
              properties:
                txReference: {type: string, minLength: 4, maxLength: 256}
                txProof: {type: string, format: binary, description: Verified transfer proof; maximum 10 MiB.}
      responses:
        '200':
          description: External settlement recorded and balanced journal posted once.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {description: Proof exceeds 10 MiB.}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/admin/payment-methods:
    post:
      tags: [Payments]
      operationId: createAdminPaymentMethod
      summary: Create a disabled payment method or currency rule
      description: Requires payments.methods.manage. New methods remain disabled until every currency, fee, KYC, limit, network and reconciliation rule is approved.
      security: [{adminSession: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PaymentMethodAdminCreateRequest'}}}
      responses:
        '201':
          description: Disabled method created and audited.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/admin/payment-methods/{code}:
    patch:
      tags: [Payments]
      operationId: patchAdminPaymentMethod
      summary: Update a payment method using optimistic concurrency
      description: Requires payments.methods.manage and a reason. If-Match protects the mutable configuration; policy/security-sensitive changes may require separate approval.
      security: [{adminSession: []}]
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PaymentMethodAdminPatchRequest'}}}
      responses:
        '200':
          description: Configuration updated and audited; returns new ETag.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Cache-Control: {schema: {type: string, const: no-store}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {description: If-Match is stale.}
  /api/v1/admin/payment-methods/{code}/country-rules:
    get:
      tags: [Payments]
      operationId: listAdminPaymentMethodCountryRules
      summary: List country eligibility rules for a payment method
      description: Requires payments.methods.manage. Returns global `*` fallback and country overrides; admin-only and no-store.
      security: [{adminSession: []}]
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/XRequestId'}
      responses:
        '200':
          description: Country rules for the method
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/PaymentMethodCountryRulesResponse'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Payments]
      operationId: createAdminPaymentMethodCountryRule
      summary: Create a country-specific or global payment eligibility rule
      description: Requires payments.methods.manage, reason, CSRF and idempotency. A disabled currency rule remains a hard deny even if the country rule is enabled.
      security: [{adminSession: []}]
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PaymentMethodCountryRuleCreateRequest'}}}
      responses:
        '201': {description: Country rule created and audited; no-store.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/admin/payment-methods/{code}/country-rules/{countryCode}:
    patch:
      tags: [Payments]
      operationId: patchAdminPaymentMethodCountryRule
      summary: Update one country eligibility rule
      description: Requires payments.methods.manage, reason, CSRF, Idempotency-Key and If-Match. Country-specific rules override global fallback; disabled currency rules always deny.
      security: [{adminSession: []}]
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - {name: countryCode, in: path, required: true, schema: {type: string, pattern: '^(?:[A-Z]{2}|\*)$'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PaymentMethodCountryRulePatchRequest'}}}
      responses:
        '200':
          description: Rule updated and audited; returns a new ETag.
          headers: {ETag: {$ref: '#/components/headers/ETag'}, Cache-Control: {schema: {type: string, const: no-store}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {description: If-Match is stale.}
  /api/v1/admin/payment-destination-accounts:
    post:
      tags: [Payments]
      operationId: createAdminPaymentDestinationAccount
      summary: Create a payment destination account
      description: Requires payments.methods.manage. Sensitive identifiers are encrypted; new account is inactive until checks pass.
      security: [{adminSession: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PaymentDestinationAccountCreateRequest'}}}
      responses:
        '201':
          description: Destination account created and audited.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/admin/payment-destination-accounts/{accountId}:
    patch:
      tags: [Payments]
      operationId: patchAdminPaymentDestinationAccount
      summary: Update destination-account settings
      description: Requires payments.methods.manage, reason, recent MFA, and If-Match. Identifier/network changes never rewrite in-flight intent assignments.
      security: [{adminSession: []}]
      parameters:
        - {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PaymentDestinationAccountPatchRequest'}}}
      responses:
        '200':
          description: Updated and audited; returns new ETag.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Cache-Control: {schema: {type: string, const: no-store}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {description: If-Match is stale.}
  /api/v1/admin/payment-destination-accounts/{accountId}/rotate:
    post:
      tags: [Payments]
      operationId: rotateAdminPaymentDestinationAccount
      summary: Pause/rotate a destination account
      description: Requires payments.methods.manage and a reason; original intent assignments remain immutable. Compromised accounts block in-flight settlement until reviewed.
      security: [{adminSession: []}]
      parameters:
        - {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PaymentReasonRequest'}}}
      responses:
        '200':
          description: Rotation and reason recorded in intent/global audit events.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/admin/payments/reconciliation:
    get:
      tags: [Payments]
      operationId: listAdminPaymentReconciliation
      summary: List manual-rail reconciliation runs and variances
      description: Requires payments.reconcile. Import and close actions must be independently audited; reconciliation never directly mutates balances.
      security: [{adminSession: []}]
      parameters:
        - {name: methodCode, in: query, schema: {type: string}}
        - {name: currency, in: query, schema: {$ref: '#/components/schemas/CurrencyCode'}}
        - {name: status, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 2048}}
        - {$ref: '#/components/parameters/XRequestId'}
      responses:
        '200':
          description: Reconciliation runs/items, source references and unresolved variance; no-store.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminPaymentReconciliationResponse'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/admin/payments/reconciliation/import:
    post:
      tags: [Payments]
      operationId: importAdminPaymentReconciliationStatement
      summary: Import an external statement for a manual payment rail
      description: Requires payments.reconcile, recent MFA and an audit reason. Statement import is idempotent by source-file hash plus period/method; importing a statement never directly credits a wallet.
      security: [{adminSession: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/PaymentReconciliationImportRequest'}
      responses:
        '202':
          description: Import accepted for bounded parsing/matching; response includes reconciliation run ID.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {description: Statement file exceeds the configured cap.}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/admin/payments/reconciliation/{runId}:
    get:
      tags: [Payments]
      operationId: getAdminPaymentReconciliationRun
      summary: Get a reconciliation run and its items
      description: Requires payments.reconcile. Run detail is no-store and includes currency-scoped items, match status, variance and sign-off history.
      security: [{adminSession: []}]
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/XRequestId'}
      responses:
        '200':
          description: Reconciliation run detail
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/PaymentReconciliationRunDetailResponse'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/admin/payments/reconciliation/{runId}/resolve:
    post:
      tags: [Payments]
      operationId: resolveAdminPaymentReconciliationItem
      summary: Resolve or escalate one reconciliation item
      description: Requires payments.reconcile, a reason, If-Match for the run version and audit. A match/waiver records evidence and never edits ledger balances directly.
      security: [{adminSession: []}]
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PaymentReconciliationResolveRequest'}}}
      responses:
        '200':
          description: Item decision persisted; returns updated run ETag.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Cache-Control: {schema: {type: string, const: no-store}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {description: If-Match is stale; reload the run before retrying.}
  /api/v1/admin/payments/reconciliation/{runId}/close:
    post:
      tags: [Payments]
      operationId: closeAdminPaymentReconciliationRun
      summary: Close a reconciliation run after all items are resolved or explicitly waived
      description: Requires payments.reconcile. Close is idempotent, requires If-Match, and fails if unresolved items or unexplained clearing variance remain.
      security: [{adminSession: []}]
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PaymentReconciliationCloseRequest'}}}
      responses:
        '200':
          description: Run closed; response includes updated ETag and variance summary.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Cache-Control: {schema: {type: string, const: no-store}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {description: If-Match is stale.}
  /api/v1/admin/payments/reconciliation/{runId}/sign-off:
    post:
      tags: [Payments]
      operationId: signOffAdminPaymentReconciliationRun
      summary: Finance sign-off for a closed reconciliation run
      description: Requires payments.reconcile and sign-off authority. Sign-off principal must differ from the run closer; step-up MFA, reason and audit are mandatory.
      security: [{adminSession: []}]
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PaymentReconciliationCloseRequest'}}}
      responses:
        '200':
          description: Independent finance sign-off recorded.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {description: If-Match is stale.}
  /api/v1/admin/payments/{paymentId}/proof-url:
    get:
      tags: [Payments]
      operationId: createFreshAdminPaymentProofUrl
      summary: Mint a fresh short-lived proof URL
      description: Requires payments.review or payments.audit. Each access is audited; only one proof owned by this payment may be returned. URL responses are no-store and never persisted by clients.
      security: [{adminSession: []}]
      parameters:
        - {name: paymentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: proofId, in: query, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/XRequestId'}
      responses:
        '200':
          description: Fresh proof URL and expiration time
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/PaymentProofUrlResponse'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/kyc/status:
    get:
      tags: [Player]
      operationId: getMyKycStatus
      summary: Read the current player's KYC status and next required action
      security: [{playerSession: []}]
      parameters: [{$ref: '#/components/parameters/XRequestId'}]
      responses:
        '200':
          description: Player-safe KYC summary, no reviewer notes
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/KycStatusResponse'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/kyc/verifications:
    post:
      tags: [Player]
      operationId: createKycVerification
      summary: Start a KYC verification attempt
      description: Requires player session, age/jurisdiction eligibility and idempotency. Creating an attempt does not mark the player verified.
      security: [{playerSession: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/KycVerificationCreateRequest'}}}
      responses:
        '201': {description: Verification attempt created; data is wrapped in the standard envelope.}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/kyc/verifications/{verificationId}:
    get:
      tags: [Player]
      operationId: getMyKycVerification
      summary: Read own KYC attempt and safe timeline
      security: [{playerSession: []}]
      parameters:
        - {name: verificationId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/XRequestId'}
      responses:
        '200': {description: Own verification state only; no-store.}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kyc/verifications/{verificationId}/documents:
    post:
      tags: [Player]
      operationId: uploadKycDocument
      summary: Upload a document to an existing verification attempt
      security: [{playerSession: []}]
      parameters:
        - {name: verificationId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {multipart/form-data: {schema: {$ref: '#/components/schemas/KycDocumentUploadRequest'}}}
      responses:
        '202': {description: Document quarantined/scanning; submission does not approve KYC.}
        '400': {$ref: '#/components/responses/ValidationError'}
        '413': {description: Document exceeds the configured size limit.}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/admin/kyc/queue:
    get:
      tags: [Backoffice]
      operationId: listAdminKycQueue
      summary: List KYC reviews
      description: Requires kyc.review; raw identity documents are not included in the list response.
      security: [{adminSession: []}]
      parameters: [{$ref: '#/components/parameters/XRequestId'}]
      responses:
        '200':
          description: Permission-filtered KYC queue.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/admin/kyc/verifications/{verificationId}:
    get:
      tags: [Backoffice, Security]
      operationId: getAdminKycVerificationDetail
      summary: Read restricted KYC verification details
      description: Requires kyc.review; metadata is no-store. Raw document bytes are not embedded and require the separate kyc.documents.read endpoint below.
      security: [{adminSession: []}]
      parameters:
        - {name: verificationId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/XRequestId'}
      responses:
        '200':
          description: Restricted verification metadata and audit timeline.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/admin/kyc/verifications/{verificationId}/documents/{documentId}/access-url:
    post:
      tags: [Backoffice, Security]
      operationId: createAdminKycDocumentAccessUrl
      summary: Mint a short-lived URL to one KYC document
      description: Requires kyc.documents.read, recent MFA, reason and audit. URL is scoped to a single document and expires quickly; the document object remains private.
      security: [{adminSession: []}]
      parameters:
        - {name: verificationId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DocumentAccessReasonRequest'}}}
      responses:
        '200':
          description: Short-lived document URL; no-store.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/DocumentAccessUrlResponse'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/admin/kyc/verifications/{verificationId}/decision:
    post:
      tags: [Backoffice]
      operationId: decideAdminKycVerification
      summary: Record a KYC decision
      description: Requires kyc.review, fresh MFA and a reason. A manual override requires an independent approver and audit trail.
      security: [{adminSession: []}]
      parameters:
        - {name: verificationId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/KycDecisionRequest'}}}
      responses:
        '200': {description: KYC decision recorded and audited.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/responsible-gambling/summary:
    get:
      tags: [Player]
      operationId: getResponsibleGamblingSummary
      summary: Read own limits, cooling-off and self-exclusion state
      security: [{playerSession: []}]
      parameters: [{$ref: '#/components/parameters/XRequestId'}]
      responses:
        '200':
          description: Player-safe RG status, current limits and next reality check
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/ResponsibleGamblingSummaryResponse'}}}
  /api/v1/responsible-gambling/limits:
    get:
      tags: [Player]
      operationId: listMyResponsibleGamblingLimits
      security: [{playerSession: []}]
      parameters: [{$ref: '#/components/parameters/XRequestId'}]
      responses:
        '200': {description: Own current and scheduled limits; no-store.}
    post:
      tags: [Player]
      operationId: createResponsibleGamblingLimit
      description: Requires idempotency and CSRF. Enforce reductions immediately or per stricter local law; increases require the policy-defined cooling-off period.
      security: [{playerSession: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResponsibleGamblingLimitCreateRequest'}}}
      responses:
        '201':
          description: Limit saved with effective time and audit record.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/responsible-gambling/self-exclusion:
    post:
      tags: [Player]
      operationId: createSelfExclusion
      summary: Start a cooling-off or self-exclusion period
      description: High-risk mutation. Must take effect immediately at the backend; client state or a stale game iframe cannot override it.
      security: [{playerSession: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SelfExclusionCreateRequest'}}}
      responses:
        '201':
          description: Exclusion acknowledged; eligibility gates apply immediately.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/admin/responsible-gambling/cases:
    get:
      tags: [Backoffice]
      operationId: listResponsibleGamblingCases
      description: Requires rg.case.read; risk flags are not returned to ordinary player endpoints.
      security: [{adminSession: []}]
      parameters: [{$ref: '#/components/parameters/XRequestId'}]
      responses:
        '200':
          description: Permission-filtered RG case queue.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/admin/responsible-gambling/cases/{caseId}/decision:
    post:
      tags: [Backoffice]
      operationId: decideResponsibleGamblingCase
      security: [{adminSession: []}]
      parameters:
        - {name: caseId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/XRequestId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResponsibleGamblingCaseDecisionRequest'}}}
      responses:
        '200': {description: Decision recorded and audited.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/player/notifications/preferences:
    get:
      tags: [Player]
      operationId: getMyNotificationPreferences
      security: [{playerSession: []}]
      parameters: [{$ref: '#/components/parameters/XRequestId'}]
      responses:
        '200':
          description: Own preferences and current version only
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreferencesResponse'}}}
    patch:
      tags: [Player]
      operationId: patchMyNotificationPreferences
      security: [{playerSession: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/XRequestId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreferencesPatchRequest'}}}
      responses:
        '200': {description: Updated preferences with new ETag; mandatory security/payment notifications cannot be disabled where law requires them.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {description: If-Match is stale.}
  /api/v1/player/account/close:
    post:
      tags: [Player]
      operationId: requestPlayerAccountClosure
      summary: Request voluntary account closure
      description: Requires recent reauthentication, CSRF and idempotency. Default 30-day cooling-off/grace is a planning placeholder; closure cannot forfeit remaining balances or bypass legal holds.
      security: [{playerSession: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/XRequestId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PlayerAccountClosureRequest'}}}
      responses:
        '202':
          description: Closure request accepted; account enters closing state and sensitive actions are gated.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/player/account/close/cancel:
    post:
      tags: [Player]
      operationId: cancelPlayerAccountClosure
      description: Available only within the approved grace period and only if law permits cancellation; self-exclusion is not cancelled by account closure cancellation.
      security: [{playerSession: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/XRequestId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PaymentReasonRequest'}}}
      responses:
        '200': {description: Closure cancellation recorded; returns account status.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/player/account/close/status:
    get:
      tags: [Player]
      operationId: getPlayerAccountClosureStatus
      security: [{playerSession: []}]
      parameters: [{$ref: '#/components/parameters/XRequestId'}]
      responses:
        '200': {description: "Own closure state, grace period and player-safe next action; no-store."}
  /api/v1/admin/players/{playerId}/wallets/{currency}/status:
    patch:
      tags: [Backoffice]
      operationId: patchAdminPlayerWalletStatus
      summary: Freeze or unfreeze a specific player wallet account
      description: Requires wallet.status.manage, If-Match, recent MFA and a reason. Player status (pending/active/suspended/closing/closed) is separate from wallet status (active/frozen/closed). Suspending a player normally freezes wallet debits/wagers and blocks new financial requests while permitted incoming credits may still post; an active player may have a frozen wallet. Closing a player follows the account-closure policy and does not delete financial records or auto-forfeit residual balances. Wallet freeze may be applied without suspending the player; AML/legal holds can independently restrict withdrawals.
      security: [{adminSession: []}]
      parameters:
        - {name: playerId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: currency, in: path, required: true, schema: {$ref: '#/components/schemas/CurrencyCode'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/XRequestId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WalletStatusPatchRequest'}}}
      responses:
        '200': {description: Wallet status updated and audited; returns new ETag.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {description: If-Match is stale.}
  /api/v1/admin/users/{adminId}/mfa-reset:
    post:
      tags: [Backoffice, Security]
      operationId: requestAdminUserMfaReset
      summary: Request a break-glass MFA reset for an administrator
      description: Requires admin.users.write and admin.mfa.manage, recent MFA from the initiating principal, a valid break-glass ticket and reason. If-Match must equal the current ETag of the target admin's security/account record, not the requester's session ETag. The requester cannot be the target. This only creates a pending reset request; it does not reset MFA until a distinct second admin principal approves through the reset-request approval route. The approver's reason is an independent rationale, not a copy of the requester's reason. Approval revokes all target sessions and marks the next login as enrollment-only; it never reveals or sets the target TOTP secret.
      security: [{adminSession: []}]
      parameters:
        - {name: adminId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/XRequestId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminMfaResetRequest'}}}
      responses:
        '202':
          description: Reset request queued for second-admin approval; target MFA is unchanged until approval.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {description: If-Match is stale.}
  /api/v1/admin/mfa-reset-requests/pending:
    get:
      tags: [Backoffice, Security]
      operationId: listPendingAdminMfaResetRequests
      summary: List MFA reset requests awaiting a second administrator
      description: Requires admin.mfa.manage and admin.users.read. Excludes requests that the caller created or is the target of; the execution service rejects approval unless requester, target and approver are distinct principals.
      security: [{adminSession: []}]
      parameters:
        - {$ref: '#/components/parameters/XRequestId'}
      responses:
        '200':
          description: Pending requests with ticket/reason metadata and version; no TOTP or recovery secrets.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
  /api/v1/admin/mfa-reset-requests/{requestId}/approve:
    post:
      tags: [Backoffice, Security]
      operationId: approveAdminMfaResetRequest
      summary: Approve and execute a pending administrator MFA reset
      description: Requires admin.mfa.manage and admin.users.write, recent MFA, a valid ticket and reason. The approver must differ from both the requester and target; self-approval is a hard 403. The operation atomically records approval/audit, revokes target sessions and marks the next login enrollment-only.
      security: [{adminSession: []}]
      parameters:
        - {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/XRequestId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminMfaResetApprovalRequest'}}}
      responses:
        '200':
          description: Reset approved, target sessions revoked and enrollment-only login required.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {description: If-Match is stale.}
  /api/v1/auth/logout-all:
    post:
      tags: [Authentication]
      operationId: logoutAllPlayerSessions
      summary: Revoke all player sessions
      security: [{playerSession: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/XRequestId'}]
      responses:
        '204': {description: "All active player sessions revoked, including current session; __Host-bclick_session and __Host-bclick_player_csrf cookies cleared."}
  /api/v1/auth/login-history:
    get:
      tags: [Authentication]
      operationId: getPlayerLoginHistory
      summary: View recent security/login events for the current player
      security: [{playerSession: []}]
      parameters: [{$ref: '#/components/parameters/XRequestId'}]
      responses:
        '200': {description: "Minimal, privacy-safe login history; no precise geolocation or raw IP unless policy specifically permits; no-store."}
  /api/v1/admin/auth/logout-all:
    post:
      tags: [Authentication, Security]
      operationId: logoutAllAdminSessions
      summary: Revoke all sessions for the current admin principal
      security: [{adminSession: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/XRequestId'}]
      responses:
        '204': {description: "All admin sessions revoked, including current session; cookies cleared and audit recorded."}
  /api/v1/admin/providers/{providerCode}/replay-callback:
    post:
      tags: [Backoffice]
      operationId: replayProviderCallback
      summary: Replay a retained provider callback through the original verified handler
      description: Requires ops.provider.replay, an audit reason, and recent MFA. Replay does not bypass the original signature/digest/environment checks or financial idempotency; conflicting payloads are refused.
      security: [{adminSession: []}]
      parameters:
        - {name: providerCode, in: path, required: true, schema: {type: string, enum: [bigbang, aggregator, winhouse]}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProviderCallbackReplayRequest'}}}
      responses:
        '202': {description: Replay queued with correlation ID; outcome recorded in audit.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/admin/settings:
    get:
      tags: [Backoffice]
      operationId: getAdminSettings
      summary: Read admin workspace settings
      description: Requires ops.read. Secrets, provider keys, and credentials are never returned.
      security: [{adminSession: []}]
      parameters: [{$ref: '#/components/parameters/XRequestId'}]
      responses:
        '200': {description: "Safe settings view; no-store, standard envelope."}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/admin/users/{adminId}:
    patch:
      tags: [Backoffice]
      operationId: patchAdminUser
      summary: Update admin status or assignments
      description: Requires admin.users.write. Cannot grant the caller elevated permissions; role assignment changes require an independent authorized actor, MFA and audit.
      security: [{adminSession: []}]
      parameters:
        - {name: adminId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserPatchRequest'}}}
      responses:
        '200': {description: Admin user updated and audited; returns new ETag.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {description: If-Match is stale.}
  /api/v1/admin/roles/{roleId}:
    patch:
      tags: [Backoffice]
      operationId: patchAdminRole
      summary: Update role metadata and permission assignments
      description: Requires admin.roles.write; privilege expansion requires independent approval and may not elevate the acting principal.
      security: [{adminSession: []}]
      parameters:
        - {name: roleId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminRolePatchRequest'}}}
      responses:
        '200': {description: Role updated and audited; returns new ETag.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {description: If-Match is stale.}
  /api/v1/auth/sessions:
    get:
      tags: [Authentication]
      operationId: listPlayerSessions
      summary: List the current player's active sessions
      security: [{playerSession: []}]
      parameters: [{$ref: '#/components/parameters/XRequestId'}]
      responses:
        '200': {description: Current player session inventory with masked device/IP metadata; no-store.}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/sessions/{sessionId}/revoke:
    post:
      tags: [Authentication]
      operationId: revokePlayerSession
      summary: Revoke one of the current player's sessions
      security: [{playerSession: []}]
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '204': {description: Session revoked; cookies are cleared if the current session was revoked.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/admin/auth/password-reset/request:
    post:
      tags: [Authentication]
      operationId: requestAdminPasswordReset
      summary: Request an admin password reset
      security: []
      parameters: [{$ref: '#/components/parameters/XRequestId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminPasswordResetRequest'}}}
      responses:
        '202': {description: Generic anti-enumeration response; no-store.}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/admin/auth/password-reset/confirm:
    post:
      tags: [Authentication]
      operationId: confirmAdminPasswordReset
      summary: Confirm an admin password reset
      security: []
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminPasswordResetConfirmRequest'}}}
      responses:
        '204': {description: Password reset completed; all existing admin sessions revoked and MFA remains required.}
        '400': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/admin/auth/sessions:
    get:
      tags: [Authentication]
      operationId: listAdminSessions
      summary: List active sessions for the current admin principal
      security: [{adminSession: []}]
      parameters: [{$ref: '#/components/parameters/XRequestId'}]
      responses:
        '200': {description: Masked session inventory; no-store.}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/admin/auth/sessions/{sessionId}/revoke:
    post:
      tags: [Authentication]
      operationId: revokeAdminSession
      summary: Revoke an admin session
      security: [{adminSession: []}]
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/XRequestId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '204': {description: Session revoked and audited.}
        '403': {$ref: '#/components/responses/Forbidden'}

components:
  securitySchemes:
    playerSession:
      type: apiKey
      in: cookie
      name: __Host-bclick_session
      description: Opaque server-side player session cookie __Host-bclick_session (Secure; HttpOnly; SameSite=Lax; Path=/; no Domain).
        Unsafe methods require the signed __Host-bclick_player_csrf cookie plus X-CSRF-Token and strict exact-Origin validation.
        Player CSRF is separate from admin and enrollment CSRF. No bearer token in localStorage. A __Host- cookie requires Secure, Path=/, and no Domain.
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-bclick_admin_session
      description: Separate admin principal/session cookie __Host-bclick_admin_session; Secure; HttpOnly; SameSite=Strict; Path=/; no Domain.
        MFA is mandatory before creating this full admin session. Unsafe methods require __Host-bclick_admin_csrf plus X-CSRF-Token
        and strict exact-Origin validation. Player and enrollment CSRF tokens are not accepted. A __Host- cookie requires Secure, Path=/, and no Domain.
    adminEnrollment:
      type: apiKey
      in: cookie
      name: __Host-bclick_admin_enrollment
      description: Short-lived, enrollment-only cookie after password authentication for an admin without 
        enrolled MFA. It permits only TOTP enrollment/verification, never Backoffice data or mutations; expire
        within 10 minutes and revoke after use.
  parameters:
    Currency:
      name: currency
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CurrencyCode'
    ContentLanguage:
      name: lang
      in: query
      required: false
      description: Explicit supported CMS locale override; highest priority. If omitted, use an authenticated 
        player's saved language, then Accept-Language for anonymous requests, then en; regional locale falls 
        back to base language and en.
      schema:
        $ref: '#/components/schemas/CmsLocale'
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Standard language-negotiation header parsed against the published CMS locale allowlist. 
        Lower priority than explicit lang and an authenticated player's saved preference; never use raw header
        content as a filesystem path or SQL fragment.
      schema: {type: string, maxLength: 256}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
      description: Same key + same payload replays outcome; different payload returns 409.
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: >-
        Optional untrusted client correlation ID. Preserve it only when it is 8-128 ASCII
        characters matching `^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$`; invalid or absent IDs are
        replaced with a server-generated ID. This request accepts any string so malformed IDs do
        not imply a 4xx response. Diagnostic only; never part of provider signature calculation.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Current opaque ETag returned by the corresponding GET; used for optimistic concurrency.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    ReportFrom:
      name: from
      in: query
      required: false
      description: Inclusive UTC interval start. Default is resolved by the report service; maximum 
        interactive range is 366 days.
      schema: {type: string, format: date-time}
    ReportTo:
      name: to
      in: query
      required: false
      description: Exclusive UTC interval end; cannot exceed resolved as_of.
      schema: {type: string, format: date-time}
    ReportAsOf:
      name: as_of
      in: query
      required: false
      description: Optional UTC report cutoff. Response always returns the resolved as_of. Historical cutoffs 
        that cannot be reconstructed are rejected.
      schema: {type: string, format: date-time}
    ReportCurrency:
      name: currency
      in: query
      required: true
      description: Exactly one currency for the whole report. Cross-currency aggregation and implicit FX 
        conversion are forbidden.
      schema: {$ref: '#/components/schemas/CurrencyCode'}
    ReportGroupBy:
      name: groupBy
      in: query
      required: false
      description: Repeated parameter. Values are validated against the report-specific allowlist; unsupported
        dimensions return 400.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 3
        items:
          type: string
          enum: [day, week, month, ticketStatus, oddsBand, processingStatus, movementKind, linkedState, 
                providerCode, gameId, gameType, roundStatus, journalType, accountKind, reconciliationStatus, 
                paymentType, paymentStatus]
    ReportPageSize:
      name: pageSize
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
      description: Maximum rows per page (hard cap 1000).
    ReportCursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, maxLength: 2048}
      description: Opaque continuation cursor bound to the resolved filters, currency, groupBy and as_of.
    ReportTicketStatus:
      name: ticketStatus
      in: query
      required: false
      schema: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$'}
      description: Normalized ticket status allowlisted by the WinHouse adapter mapping.
    ReportProviderCode:
      name: providerCode
      in: query
      required: false
      schema: {type: string, enum: [bigbang, aggregator, winhouse]}
    ReportProviderEnvironment:
      name: providerEnvironment
      in: query
      required: false
      schema: {type: string, enum: [sandbox, production]}
    ReportProcessingStatus:
      name: processingStatus
      in: query
      required: false
      schema: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$'}
    ReportGameId:
      name: gameId
      in: query
      required: false
      schema: {type: string, format: uuid}
    ReportGameType:
      name: gameType
      in: query
      required: false
      schema: {type: string, minLength: 1, maxLength: 64}
    ReportRoundStatus:
      name: roundStatus
      in: query
      required: false
      schema: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$'}
    ReportMinOdds:
      name: minOdds
      in: query
      required: false
      schema: {$ref: '#/components/schemas/PositiveAmount'}
    ReportMaxOdds:
      name: maxOdds
      in: query
      required: false
      schema: {$ref: '#/components/schemas/PositiveAmount'}
    ReportJournalType:
      name: journalType
      in: query
      required: false
      schema: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$'}
    ReportAccountKind:
      name: accountKind
      in: query
      required: false
      schema: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$'}
    ReportPaymentType:
      name: paymentType
      in: query
      required: false
      schema: {type: string, enum: [deposit, withdrawal]}
    ReportPaymentStatus:
      name: paymentStatus
      in: query
      required: false
      schema: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$'}
    ReportReconciliationStatus:
      name: reconciliationStatus
      in: query
      required: false
      schema: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$'}
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Required on every unsafe method authenticated with a player or admin cookie. Must match the CSRF cookie for
        that security context (`__Host-bclick_player_csrf` or `__Host-bclick_admin_csrf`) and be bound to the
        current server session. Enrollment endpoints use `__Host-bclick_admin_enrollment_csrf` bound to the
        short-lived enrollment challenge; never accept a token from another context.
      schema:
        type: string
        minLength: 32
        maxLength: 512

  headers:
    SessionCookie:
      description: Emits __Host-bclick_session (Secure; HttpOnly; SameSite=Lax; Path=/; no Domain) plus a separate
        Set-Cookie for signed, JavaScript-readable __Host-bclick_player_csrf (Secure; SameSite=Strict; Path=/;
        no Domain; not HttpOnly) whenever the response establishes an authenticated player session. The current
        registration operation also references this header; if it establishes a session, it must issue the same CSRF
        cookie atomically. Clear the CSRF cookie on player logout/revocation. A __Host- cookie requires Secure,
        Path=/, and no Domain.
      schema: {type: string}
    ETag:
      description: Opaque entity version for conditional updates.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    XRequestId:
      description: Server-generated or validated correlation identifier.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
    ExpiredSessionCookie:
      description: 'Player logout/revocation clears __Host-bclick_session (Secure; HttpOnly; Path=/; no Domain; Max-Age=0)
        and __Host-bclick_player_csrf (Secure; Path=/; no Domain; Max-Age=0). __Host- requires Secure, Path=/, and no Domain.'
      schema:
        type: string
    AdminSessionCookie:
      description: After successful TOTP or one-time recovery-code verification, emit __Host-bclick_admin_session (Secure; HttpOnly; SameSite=Strict; Path=/; no Domain) plus __Host-bclick_admin_csrf (Secure; SameSite=Strict; Path=/; no Domain; not HttpOnly) bound to that full session. Also expire __Host-bclick_admin_challenge. Rotate CSRF on session rotation/privilege change; clear it on admin logout/revocation. If this is the first session following enrollment TOTP verification, also clear __Host-bclick_admin_enrollment and __Host-bclick_admin_enrollment_csrf. A __Host- cookie requires Secure, Path=/, and no Domain.
      schema:
        type: string
    AdminEnrollmentCookie:
      description: Every successful admin password challenge emits a separate Set-Cookie for __Host-bclick_admin_challenge (Secure; HttpOnly; SameSite=Strict; Path=/; no Domain; expires within 5 minutes), containing a random browser-binding secret whose hash is stored with the one-time challenge. Only when status is enrollment_required, also emit separate Set-Cookie headers for __Host-bclick_admin_enrollment (Secure; HttpOnly; SameSite=Strict; Path=/; no Domain; expires within 10 minutes) and __Host-bclick_admin_enrollment_csrf (Secure; SameSite=Strict; Path=/; no Domain; JavaScript-readable) bound to that challenge. When status is mfa_required, neither enrollment cookie is emitted. Clear the challenge cookie after successful verification or expiry/revocation. Delete both enrollment cookies on expiry/revocation or successful TOTP verification; then issue a fresh __Host-bclick_admin_csrf with the full admin session. Enrollment CSRF is accepted only on TOTP enrollment routes. Every __Host- cookie requires Secure, Path=/, and no Domain.
      schema:
        type: string
    ExpiredAdminSessionCookie:
      description: Logout/revocation clears __Host-bclick_admin_session (Secure; HttpOnly; Path=/; no Domain; Max-Age=0)
        and __Host-bclick_admin_csrf (Secure; Path=/; no Domain; Max-Age=0).
      schema:
        type: string
  responses:
    ValidationError:
      description: Input rejected without financial side effects.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: No valid session or credentials.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: Authenticated but not authorized.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: Resource missing or inaccessible to this actor.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: Conflicting idempotency key, stale quote or invalid state transition.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    BusinessRefusal:
      description: Valid request refused by business rules; no wallet movement is posted.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RateLimited:
      description: Request throttled. Retry-After may be provided.
      headers:
        Retry-After: {schema: {type: integer}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ServiceUnavailable:
      description: Service unavailable. Body uses the standard ErrorResponse schema.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReadinessUnavailable:
      description: Readiness failed. Body has HealthResponse shape with status=not_ready; never include secret
        diagnostics.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthResponse'
  schemas:
    BigBangAdminSettingsResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [sourceCode, selectedTier, supportedTiers, premiumAvailable, premiumReason, sync]
          properties:
            sourceCode: {type: string, const: bigbang}
            selectedTier: {type: string, const: standard}
            supportedTiers: {type: array, items: {type: string, enum: [standard]}, minItems: 1, maxItems: 1}
            premiumAvailable: {type: boolean, const: false}
            premiumReason: {type: string}
            sync:
              type: object
              additionalProperties: false
              required: [latestStatus, lastSucceededAt]
              properties:
                latestStatus: {type: [string, 'null']}
                lastSucceededAt: {type: [string, 'null'], format: date-time}
        requestId: {type: string}
    BigBangAdminProvider:
      type: object
      additionalProperties: false
      required: [id, code, name, enabled, updatedAt, totalGames, sourceAvailableGames, enabledGames, tiers]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        enabled: {type: boolean}
        updatedAt: {type: string, format: date-time}
        totalGames: {type: integer, minimum: 0}
        sourceAvailableGames: {type: integer, minimum: 0}
        enabledGames: {type: integer, minimum: 0}
        tiers:
          type: object
          additionalProperties: false
          required: [standard, premium]
          properties:
            standard:
              type: object
              additionalProperties: false
              required: [enabled, sourceAvailableGames]
              properties:
                enabled: {type: boolean}
                sourceAvailableGames: {type: integer, minimum: 0}
            premium:
              type: object
              additionalProperties: false
              required: [enabled, sourceAvailableGames, available]
              properties:
                enabled: {type: boolean}
                sourceAvailableGames: {type: integer, minimum: 0}
                available: {type: boolean, const: false}
    BigBangAdminProvidersResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/BigBangAdminProvider'}}
        requestId: {type: string}
    BigBangAdminGame:
      type: object
      additionalProperties: false
      required: [id, slug, title, provider, sourceAvailable, catalogAvailable, enabled, providerEnabled, updatedAt]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        title: {type: string}
        provider:
          type: object
          additionalProperties: false
          required: [code, name]
          properties:
            code: {type: string}
            name: {type: string}
        sourceAvailable: {type: boolean}
        catalogAvailable: {type: boolean}
        enabled: {type: boolean}
        providerEnabled: {type: boolean}
        updatedAt: {type: string, format: date-time}
    BigBangAdminGamesResponse:
      type: object
      additionalProperties: false
      required: [data, page, requestId]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/BigBangAdminGame'}}
        page:
          type: object
          additionalProperties: false
          required: [page, pageSize, total, nextPage]
          properties:
            page: {type: integer, minimum: 1}
            pageSize: {type: integer, minimum: 1, maximum: 100}
            total: {type: integer, minimum: 0}
            nextPage: {type: [integer, 'null'], minimum: 1}
        requestId: {type: string}
    BigBangAdminControlPatchRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
    BigBangAdminProviderControlResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, code, name, enabled, updatedAt]
          properties:
            id: {type: string, format: uuid}
            code: {type: string}
            name: {type: string}
            enabled: {type: boolean}
            updatedAt: {type: string, format: date-time}
        requestId: {type: string}
    BigBangAdminGameControlResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, slug, title, enabled, updatedAt]
          properties:
            id: {type: string, format: uuid}
            slug: {type: string}
            title: {type: string}
            enabled: {type: boolean}
            updatedAt: {type: string, format: date-time}
        requestId: {type: string}
    DecimalAmount:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
      maxLength: 32
      description: Exact signed decimal string. Signed values are valid for journal/statement amounts. Do not 
        use for player wallet balance fields (use NonNegativeAmount) or positive payment requests (use 
        PositiveAmount). Enforce enabled currency exponent at runtime. No exponent notation.
      examples: ['12.34']
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          $ref: '#/components/schemas/NonNegativeAmount'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok, not_ready]}
      description: 'Same body shape for 200 and 503. The HTTP status is authoritative: 200 means ready/live; 503
        with status=not_ready means dependencies/config are not ready. Do not include secret diagnostic detail.'
    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object, additionalProperties: true}
        requestId: {type: string}
    PlayerSummary:
      type: object
      required: [id, status, emailVerificationStatus, kycTier, kycLock, settlementCurrency]
      properties:
        id: {type: string, format: uuid}
        status:
          type: string
          enum: [active, suspended, closed, pending]
          description: New registrations are active after successful server-side eligibility validation.
        emailVerificationStatus:
          type: string
          enum: [not_required, pending, verified, rejected, expired]
          default: not_required
          description: Email-verification lifecycle only. This field is not KYC status and does not determine the player's KYC tier.
        kycTier:
          type: string
          enum: [none, basic, verified, enhanced]
          default: none
          description: >-
            Server-controlled KYC tier. none=Level 0, basic=Level 1, verified=Level 2 (ID, address and source of funds),
            enhanced=Level 3. The value verified here is not emailVerificationStatus=verified.
        kycStatus:
          type: string
          enum: [not_started, submitted, in_review, additional_information_required, verified, rejected, expired]
          description: Optional detailed status for the current kyc_verifications lifecycle; omit when no detailed verification status is available.
        kycLock:
          type: boolean
          default: false
          description: Administrative KYC lock. If true and kycTier is below Level 2 (verified), all deposits are blocked and no override bypasses this lock.
        depositKycOverride:
          type: [string, 'null']
          enum: [require, waive, null]
          default: null
          description: Null means no override; require imposes at least Level 2 KYC; waive is valid only within its approved scope and expiry/dual-approval rules.
        depositKycOverrideExpiresAt:
          type: [string, 'null']
          format: date-time
          default: null
          description: >-
            Future timestamp means temporary waiver. Null expiry with depositKycOverride=waive means permanent waiver and requires dual approval by distinct admin principals.
        depositKycOverrideReason:
          type: [string, 'null']
          description: Safe current override reason/summary. Do not include internal investigation secrets.
        depositKycLockReason:
          type: [string, 'null']
          description: Safe reason/summary for the administrative KYC lock; do not include internal investigation secrets.
        settlementCurrency: {$ref: '#/components/schemas/CurrencyCode', description: Immutable product settlement currency selected at registration; does not follow preferredDisplayCurrency.}
        displayName: {type: string}
        email: {type: string, format: email}
    PlayerResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [player]
          properties:
            player: {$ref: '#/components/schemas/PlayerSummary'}
        requestId: {type: string}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, countryCode, settlementCurrency, dateOfBirth, acceptTerms, acceptAgeConfirmation, preferredLanguage, captchaToken]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 12, maxLength: 1024, format: password, writeOnly: true}
        countryCode: {type: string, pattern: '^[A-Z]{2}$', description: Registration country; validated against the server's supported-jurisdiction and compliance policy.}
        settlementCurrency: {$ref: '#/components/schemas/CurrencyCode', description: Required product settlement currency. Immutable under the one-currency-per-player policy; do not infer it from display currency.}
        dateOfBirth:
          type: string
          format: date
          description: >-
            Required date-only value. The server validates the real calendar date, rejects future dates and requires age >= 18 at registration; client validation is not authoritative.
        acceptTerms:
          type: boolean
          const: true
          description: Must be true. The server stores the acceptance timestamp and active terms version.
        acceptAgeConfirmation:
          type: boolean
          const: true
          description: Must be true. The server stores the acknowledgement timestamp and policy version; this does not replace server-side DOB/age validation.
        preferredLanguage:
          $ref: '#/components/schemas/LanguageCode'
          description: >-
            Required saved language selected at registration; clients should preselect en by default. The server also defaults persisted preference to en where a default is applicable.
          default: en
        username:
          type: [string, 'null']
          maxLength: 64
          default: null
          description: Optional username. Normalize on the server, enforce uniqueness atomically and reject reserved/system names.
        phoneNumber:
          type: [string, 'null']
          pattern: '^\+[1-9][0-9]{1,14}$'
          default: null
          description: Optional phone number in E.164 format. Supplying it does not mean the phone number is verified.
        captchaToken:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: Required CAPTCHA response token, verified server-to-server using the configured provider. Never log this token.
        preferredDisplayCurrency:
          allOf:
            - $ref: '#/components/schemas/CurrencyCode'
          description: Optional presentation preference only; it never changes settlement currency or provider/payment routing.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 1024, format: password}
    PreferencesResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          properties:
            preferredDisplayCurrency:
              $ref: '#/components/schemas/CurrencyCode'
            language: {$ref: '#/components/schemas/LanguageCode'}
        requestId: {type: string}
    WalletBalance:
      type: object
      required: [currency, balance, available, held, asOf]
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        balance:
          $ref: '#/components/schemas/NonNegativeAmount'
        available:
          $ref: '#/components/schemas/NonNegativeAmount'
        held:
          $ref: '#/components/schemas/NonNegativeAmount'
        bonusRestrictedBalance: {type: [string, 'null'], description: Separate bonus-restricted amount; never included in balance or available cash. Null when the product contract does not expose it.}
        asOf: {type: string, format: date-time}
      description: 'Projection-backed player cash balance by currency: balance = available + held for player cash
        accounts; available and held are non-negative. Bonus-restricted funds are not included in these values unless
        exposed separately by an approved contract.'
    StatementResponse:
      type: object
      required:
        - data
        - page
        - requestId
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, type, amount, currency, createdAt, status]
            properties:
              id: {type: string, format: uuid}
              type: {type: string}
              amount: {$ref: '#/components/schemas/DecimalAmount', description: 'Signed player-perspective amount:
                  positive = net credit, negative = net debit. Entries are exact decimal strings; zero-money provider
                  notifications are not statement rows.'}
              currency:
                $ref: '#/components/schemas/CurrencyCode'
              createdAt: {type: string, format: date-time}
              status: {type: string, enum: [posted], description: Always posted because statement rows reflect
                  committed ledger movements only.}
              reference: {type: string}
              description: {type: string}
        page:
          $ref: '#/components/schemas/ListPage'
        requestId: {type: string}
        meta:
          $ref: '#/components/schemas/StatementMeta'
      description: 'Statement is a view of posted ledger movements only. A reversal is a separate compensating posted
        row; the original row remains posted. Pending payment intents are queried via payment-intent resources and
        are not statement rows. Zero-money notifications are excluded. Standard list envelope: `data` array, `page`
        cursor/offset metadata, optional `meta`, and `requestId`.'
    FxQuoteResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [quoteId, source, target, rate, rateSource, observedAt, expiresAt]
          properties:
            quoteId: {type: string, format: uuid}
            source: {$ref: '#/components/schemas/Money'}
            target: {$ref: '#/components/schemas/Money'}
            rate: {$ref: '#/components/schemas/PositiveAmount'}
            fee: {$ref: '#/components/schemas/Money'}
            rateSource: {type: string}
            observedAt: {type: string, format: date-time}
            expiresAt: {type: string, format: date-time}
            feeCurrencyRule:
              type: string
              enum:
                - source_fee_deducted_before_conversion
              description: The fee is denominated in source currency and deducted from the gross source amount
                before conversion; the quoted target amount reflects net source × rate and currency-specific 
                target rounding.
        requestId: {type: string}
    FxExecutionResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [executionId, source, target, executedAt]
          properties:
            executionId: {type: string, format: uuid}
            source: {$ref: '#/components/schemas/Money'}
            target: {$ref: '#/components/schemas/Money'}
            executedAt: {type: string, format: date-time}
        requestId: {type: string}
    Category:
      type: object
      required: [slug, title]
      properties:
        slug: {type: string}
        title: {type: string}
        icon: {type: [string, 'null']}
    CategoriesResponse:
      type: object
      required:
        - data
        - page
        - requestId
        - meta
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Category'}}
        requestId: {type: string}
        page:
          $ref: '#/components/schemas/ListPage'
        meta:
          $ref: '#/components/schemas/CmsResponseMeta'
      description: 'Standard list envelope: `data` array, `page` cursor/offset metadata, required `meta`, and `requestId`.'
    ProviderSummary:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
    ProvidersResponse:
      type: object
      required:
        - data
        - page
        - requestId
        - meta
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/ProviderSummary'}}
        requestId: {type: string}
        page:
          $ref: '#/components/schemas/ListPage'
        meta:
          $ref: '#/components/schemas/CmsResponseMeta'
      description: 'Standard list envelope: `data` array, `page` cursor/offset metadata, required `meta`, and `requestId`.'
    GameSummary:
      type: object
      required:
        - id
        - slug
        - title
        - provider
        - categories
        - available
        - modes
      properties:
        id: {type: string, format: uuid}
        slug:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Stable public slug used by existing player routes such as 
            /casino/play/demo/zeus-vs-hades; not an authorization token.
        title: {type: string}
        provider: {$ref: '#/components/schemas/ProviderSummary'}
        categories:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 80
          description: All normalized category slugs; a game may belong to multiple categories.
        category:
          type: string
          deprecated: true
          description: Legacy primary category only. Use categories; this compatibility field must not be used
            to infer the full category set.
        imageUrl: {type: [string, 'null'], format: uri}
        available: {type: boolean}
        modes:
          type: object
          required: [demo, real]
          properties:
            demo: {type: boolean}
            real: {type: boolean}
    GamesResponse:
      type: object
      required:
        - data
        - page
        - requestId
        - meta
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/GameSummary'}}
        page:
          $ref: '#/components/schemas/ListPage'
        requestId: {type: string}
        meta:
          $ref: '#/components/schemas/CmsResponseMeta'
      description: 'Standard list envelope: `data` array, `page` cursor/offset metadata, required `meta`, and `requestId`.'
    GameResponse:
      type: object
      required: [data, requestId]
      properties:
        data: {$ref: '#/components/schemas/GameSummary'}
        requestId: {type: string}
    LaunchResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [sessionId, launchUrl, mode, expiresAt]
          properties:
            sessionId: {type: string, format: uuid}
            launchUrl: {type: string, format: uri}
            mode: {type: string, enum: [demo, real]}
            expiresAt: {type: [string, 'null'], format: date-time}
        requestId: {type: string}
    SportsbookBootstrapResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [embedKey, language]
          properties:
