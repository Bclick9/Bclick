        wageringMultiplier: {type: integer, minimum: 0, maximum: 100}
        wageringBase: {type: string, enum: [bonus_only, deposit_plus_bonus, fixed_turnover]}
        eligibleProducts:
          type: array
          items: {type: string, enum: [casino, sportsbook]}
        maxBet: {$ref: '#/components/schemas/PositiveAmount'}
        winningsCap:
          oneOf:
            - $ref: '#/components/schemas/NonNegativeAmount'
            - type: 'null'
