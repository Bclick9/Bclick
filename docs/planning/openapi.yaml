        '200':
          description: Ledger-derived totals, reconciled projection and as-of timestamp.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BalanceReportResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: getAdminBalanceReports
  /api/v1/admin/reports/sportsbook/betting-activity:
    get:
      tags: [Reporting]
      security: [adminSession: []]
      summary: Betting activity report (SB-01)
      description: "Aggregates WinHouse sportsbook ticket activity by currency and time/status. Ticket totals are
        not double-counted with provider transaction cross-checks. Response always includes as_of and a single currency.
        Allowed groupBy: day, week, month, ticketStatus, oddsBand. Requires reports.read."
      x-report-id: SB-01
      x-required-permissions: [reports.read]
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportAsOf'
        - $ref: '#/components/parameters/ReportCurrency'
        - $ref: '#/components/parameters/ReportGroupBy'
        - $ref: '#/components/parameters/ReportPageSize'
        - $ref: '#/components/parameters/ReportCursor'
        - $ref: '#/components/parameters/ReportTicketStatus'
        - $ref: '#/components/parameters/ReportMinOdds'
        - $ref: '#/components/parameters/ReportMaxOdds'
      responses:
        '200':
          description: Report aggregates as of the resolved UTC cutoff in one currency.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SportsbookReportResponse'}
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422':
          description: Historical as_of cannot be reconstructed from available source history.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      operationId: getAdminReportSportsbookBettingActivity
    post:
      tags: [Reporting]
      security: [adminSession: []]
      summary: Export Betting activity report (SB-01) as CSV or XLSX
      description: "Generates a bounded synchronous export. Requires reports.read and reports.export. A successful
        logical export is audited in audit_events before file bytes are sent; idempotent retries replay the original
        result. Maximum 10,000 rows and 20 MiB generated artifact."
      x-report-id: SB-01
      x-required-permissions: [reports.read, reports.export]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportExportRequest'}
      responses:
        '200':
          description: Export file. CSV or XLSX content type is selected by body.format. The artifact and 
            response headers carry the resolved as_of and single currency; includes X-Report-Audit-Id and 
            no-store cache policy.
          headers:
            Content-Disposition:
              description: Attachment filename with report ID and resolved timestamp.
              schema: {type: string}
            Cache-Control:
              description: Always no-store for report exports.
              schema: {type: string, enum: [no-store]}
            X-Report-As-Of:
              description: Exact UTC cutoff represented in the export file.
              schema: {type: string, format: date-time}
            X-Report-Currency:
              description: The one currency included in the export.
              schema: {$ref: '#/components/schemas/CurrencyCode'}
            X-Report-Audit-Id:
              description: ID of the append-only audit_events row recording this logical export.
              schema: {type: string, format: uuid}
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            text/csv:
              schema: {type: string, description: CSV text body; Content-Disposition provides the download filename.}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413':
          description: Export exceeds the configured row/file limit; narrow the query and retry with a new 
            idempotency key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Historical as_of cannot be reconstructed from available source history.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      operationId: exportAdminReportSportsbookBettingActivity
