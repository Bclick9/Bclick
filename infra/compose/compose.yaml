services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bclick_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository-root .env}
      POSTGRES_DB: ${POSTGRES_DB:-bclick}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DB_POOL_MAX: 10
      DATABASE_URL: postgresql://${POSTGRES_USER:-bclick_dev}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository-root .env}@postgres:5432/${POSTGRES_DB:-bclick}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    profiles: ["tools"]
    command: ["pnpm", "--filter", "@bclick/server", "migrate:up"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-bclick_dev}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository-root .env}@postgres:5432/${POSTGRES_DB:-bclick}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
