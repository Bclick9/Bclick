services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bclick_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository-root .env}
      POSTGRES_DB: ${POSTGRES_DB:-bclick}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      bclick-local:
        aliases:
          - postgres
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DB_POOL_MAX: 10
      DATABASE_URL: postgresql://${POSTGRES_USER:-bclick_dev}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository-root .env}@postgres:5432/${POSTGRES_DB:-bclick}
      BCLICK_IDENTITY_ENABLED: ${BCLICK_IDENTITY_ENABLED:-false}
      BCLICK_SESSION_HASH_KEY: ${BCLICK_SESSION_HASH_KEY:-}
      BCLICK_CSRF_SIGNING_KEY: ${BCLICK_CSRF_SIGNING_KEY:-}
      BCLICK_TOTP_ENCRYPTION_KEY: ${BCLICK_TOTP_ENCRYPTION_KEY:-}
      BCLICK_PLAYER_ALLOWED_ORIGINS: ${BCLICK_PLAYER_ALLOWED_ORIGINS:-http://localhost:5173}
      BCLICK_ADMIN_ALLOWED_ORIGINS: ${BCLICK_ADMIN_ALLOWED_ORIGINS:-http://localhost:5174}
      BCLICK_LOCAL_MAIL_SINK_PATH: ${BCLICK_LOCAL_MAIL_SINK_PATH:-.local-mail-sink.jsonl}
      BCLICK_TERMS_VERSION: ${BCLICK_TERMS_VERSION:-local-terms-v1}
      BCLICK_AGE_POLICY_VERSION: ${BCLICK_AGE_POLICY_VERSION:-local-age-policy-v1}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bclick-local
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    profiles: ["tools"]
    command: ["pnpm", "--filter", "@bclick/server", "migrate:up"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-bclick_dev}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository-root .env}@postgres:5432/${POSTGRES_DB:-bclick}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bclick-local

volumes:
  postgres-data:

networks:
  bclick-local:
    driver: bridge
