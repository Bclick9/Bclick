name: Identity Migration 001 CI rehearsal (disposable database only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/migrations/**'
      - 'server/scripts/identity-pre-migration-gate.ts'
      - 'server/scripts/identity-migration-001-rehearsal.mjs'
      - 'server/src/identity/**'
      - 'server/test/identity.test.ts'
      - 'server/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/identity-migration-001-preflight.yml'
      - '.github/workflows/identity-migration-001-rehearsal.yml'
  push:
    branches: [main]
    paths:
      - 'server/migrations/**'
      - 'server/scripts/identity-pre-migration-gate.ts'
      - 'server/scripts/identity-migration-001-rehearsal.mjs'
      - 'server/src/identity/**'
      - 'server/test/identity.test.ts'
      - 'server/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/identity-migration-001-preflight.yml'
      - '.github/workflows/identity-migration-001-rehearsal.yml'

permissions:
  contents: read

concurrency:
  group: identity-migration-001-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Apply, assert, rollback, and re-apply Migration 001 on disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: bclick_ci
          POSTGRES_USER: bclick_ci
          POSTGRES_PASSWORD: bclick_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bclick_ci -d bclick_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://bclick_ci:bclick_ci_password@127.0.0.1:5432/bclick_ci
      BCLICK_PREFLIGHT_TARGET: ci-disposable
      BCLICK_M001_REHEARSAL_TARGET: ci-disposable
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked workspace
        run: pnpm install --frozen-lockfile

      - name: Build the pre-migration schema using the two approved baseline files only
        run: |
          mkdir -p /tmp/bclick-approved-baseline-migrations
          cp server/migrations/1792497600000_api_skeleton_baseline.sql /tmp/bclick-approved-baseline-migrations/
          cp server/migrations/1792512000000_identity_sessions.sql /tmp/bclick-approved-baseline-migrations/
          cd server
          pnpm exec node-pg-migrate up --migrations-dir /tmp/bclick-approved-baseline-migrations --database-url-var DATABASE_URL

      - name: Run the mandatory read-only pre-Migration-001 gate
        run: pnpm --filter @bclick/server exec tsx scripts/identity-pre-migration-gate.ts

      - name: Apply exactly Migration 001 on disposable CI PostgreSQL
        run: |
          set -euo pipefail
          mkdir -p /tmp/bclick-m001-only-migrations
          cp server/migrations/1792497600000_api_skeleton_baseline.sql /tmp/bclick-m001-only-migrations/
          cp server/migrations/1792512000000_identity_sessions.sql /tmp/bclick-m001-only-migrations/
          cp server/migrations/1792584000000_identity_domain_migration_001.sql /tmp/bclick-m001-only-migrations/
          cd server
          pnpm exec node-pg-migrate up --count 1 --migrations-dir /tmp/bclick-m001-only-migrations --database-url-var DATABASE_URL

      - name: Verify renamed schema, seed precision, legacy RBAC preservation, and constraint behavior
        run: pnpm --filter @bclick/server exec node scripts/identity-migration-001-rehearsal.mjs post-up

      - name: Install disposable populated-player fixture for rollback safety test
        run: pnpm --filter @bclick/server exec node scripts/identity-migration-001-rehearsal.mjs install-rollback-fixture

      - name: Confirm rollback refuses to remove populated player data
        shell: bash
        run: |
          set +e
          (cd server && pnpm exec node-pg-migrate down --migrations-dir /tmp/bclick-m001-only-migrations --database-url-var DATABASE_URL --count 1)
          down_status=$?
          set -e
          if [ "$down_status" -eq 0 ]; then
            echo "ERROR: Migration 001 rollback unexpectedly succeeded with a player row present."
            exit 1
          fi
          echo "Expected refusal observed; next step verifies the fixture and migration history remain intact."

      - name: Verify refusal preserved data, then remove only the disposable test fixture
        run: pnpm --filter @bclick/server exec node scripts/identity-migration-001-rehearsal.mjs verify-rollback-guard

      - name: Roll back Migration 001 on the now-empty disposable database
        run: |
          cd server
          pnpm exec node-pg-migrate down --migrations-dir /tmp/bclick-m001-only-migrations --database-url-var DATABASE_URL --count 1

      - name: Verify rollback restored the original two-migration baseline
        run: pnpm --filter @bclick/server exec node scripts/identity-migration-001-rehearsal.mjs post-down

      - name: Re-apply exactly Migration 001 after a clean rollback
        run: |
          cd server
          pnpm exec node-pg-migrate up --count 1 --migrations-dir /tmp/bclick-m001-only-migrations --database-url-var DATABASE_URL

      - name: Verify re-application is clean and complete
        run: pnpm --filter @bclick/server exec node scripts/identity-migration-001-rehearsal.mjs post-up

      - name: Apply remaining migrations to test current API against the latest schema
        run: pnpm --filter @bclick/server migrate:up

      - name: Run API tests against the renamed schema
        env:
          NODE_ENV: test
          HOST: 127.0.0.1
          BCLICK_IDENTITY_ENABLED: 'true'
          BCLICK_SESSION_HASH_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          BCLICK_CSRF_SIGNING_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
          BCLICK_TOTP_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
          BCLICK_PLAYER_ALLOWED_ORIGINS: https://localhost:5173
          BCLICK_ADMIN_ALLOWED_ORIGINS: https://localhost:5174
          BCLICK_LOCAL_MAIL_SINK_PATH: /tmp/bclick-identity-test-mail.jsonl
          BCLICK_TERMS_VERSION: ci-terms-v1
          BCLICK_AGE_POLICY_VERSION: ci-age-policy-v1
        run: pnpm --filter @bclick/server test
