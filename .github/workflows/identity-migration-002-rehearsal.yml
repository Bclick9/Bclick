name: Identity Migration 002 CI rehearsal (disposable database only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/migrations/1792670400000_identity_sessions_split_002.sql'
      - 'server/scripts/identity-migration-002-rehearsal.mjs'
      - 'server/src/identity/service.ts'
      - 'server/test/identity.test.ts'
      - 'server/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/identity-migration-002-rehearsal.yml'
  push:
    branches: [main]
    paths:
      - 'server/migrations/1792670400000_identity_sessions_split_002.sql'
      - 'server/scripts/identity-migration-002-rehearsal.mjs'
      - 'server/src/identity/service.ts'
      - 'server/test/identity.test.ts'
      - 'server/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/identity-migration-002-rehearsal.yml'

permissions:
  contents: read

concurrency:
  group: identity-migration-002-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Apply, assert, rollback, and re-apply Migration 002 on disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: bclick_ci
          POSTGRES_USER: bclick_ci
          POSTGRES_PASSWORD: bclick_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bclick_ci -d bclick_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://bclick_ci:bclick_ci_password@127.0.0.1:5432/bclick_ci
      BCLICK_M002_REHEARSAL_TARGET: ci-disposable
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked workspace
        run: pnpm install --frozen-lockfile

      - name: Apply the ordered migrations to disposable PostgreSQL
        run: pnpm --filter @bclick/server migrate:up

      - name: Assert Migration 002 schema, FKs, MFA constraint, currencies and legacy RBAC
        run: pnpm --filter @bclick/server exec node scripts/identity-migration-002-rehearsal.mjs post-up

      - name: Run Identity API tests against split session schema
        env:
          NODE_ENV: test
          HOST: 127.0.0.1
          BCLICK_IDENTITY_ENABLED: 'true'
          BCLICK_SESSION_HASH_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          BCLICK_CSRF_SIGNING_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
          BCLICK_TOTP_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
          BCLICK_PLAYER_ALLOWED_ORIGINS: https://localhost:5173
          BCLICK_ADMIN_ALLOWED_ORIGINS: https://localhost:5174
          BCLICK_LOCAL_MAIL_SINK_PATH: /tmp/bclick-identity-test-mail.jsonl
          BCLICK_TERMS_VERSION: ci-terms-v1
          BCLICK_AGE_POLICY_VERSION: ci-age-policy-v1
        run: pnpm --filter @bclick/server test

      - name: Install player and MFA-complete admin session fixtures for rollback guard
        run: pnpm --filter @bclick/server exec node scripts/identity-migration-002-rehearsal.mjs install-rollback-fixtures

      - name: Confirm rollback refuses while either split session table contains rows
        shell: bash
        run: |
          set +e
          (cd server && pnpm exec node-pg-migrate down --migrations-dir ./migrations --database-url-var DATABASE_URL --count 1)
          down_status=$?
          set -e
          if [ "$down_status" -eq 0 ]; then
            echo "ERROR: Migration 002 rollback unexpectedly succeeded with session rows present."
            exit 1
          fi
          echo "Expected refusal observed; next step verifies both session rows and history are intact."

      - name: Verify rollback guard preserved sessions, then clean only disposable fixtures
        run: pnpm --filter @bclick/server exec node scripts/identity-migration-002-rehearsal.mjs verify-rollback-guard

      - name: Roll back Migration 002 on the now-empty disposable database
        run: |
          cd server
          pnpm exec node-pg-migrate down --migrations-dir ./migrations --database-url-var DATABASE_URL --count 1

      - name: Verify rollback restored auth_sessions and the three-migration baseline
        run: pnpm --filter @bclick/server exec node scripts/identity-migration-002-rehearsal.mjs post-down

      - name: Re-apply exactly Migration 002 after clean rollback
        run: pnpm --filter @bclick/server exec node-pg-migrate up --count 1 --migrations-dir ./migrations --database-url-var DATABASE_URL

      - name: Verify re-application is clean and complete
        run: pnpm --filter @bclick/server exec node scripts/identity-migration-002-rehearsal.mjs post-up

      - name: Re-run Identity API tests against the re-applied split schema
        env:
          NODE_ENV: test
          HOST: 127.0.0.1
          BCLICK_IDENTITY_ENABLED: 'true'
          BCLICK_SESSION_HASH_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          BCLICK_CSRF_SIGNING_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
          BCLICK_TOTP_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
          BCLICK_PLAYER_ALLOWED_ORIGINS: https://localhost:5173
          BCLICK_ADMIN_ALLOWED_ORIGINS: https://localhost:5174
          BCLICK_LOCAL_MAIL_SINK_PATH: /tmp/bclick-identity-test-mail.jsonl
          BCLICK_TERMS_VERSION: ci-terms-v1
          BCLICK_AGE_POLICY_VERSION: ci-age-policy-v1
        run: pnpm --filter @bclick/server test
